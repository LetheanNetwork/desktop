version: "3"

tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../../_lib/run.sh

        isolate_home
        output="$(mktemp)"
        trap "rm -f $output; rm -rf $LTHN_TEST_HOME" EXIT

        # Missing args — exit 2
        run_capture_all 2 "$output" ../../bin/lthn state get
        assert_contains "usage" "$output"

        run_capture_all 2 "$output" ../../bin/lthn state get config
        assert_contains "usage" "$output"

        # Seed
        ../../bin/lthn state set config host homelab

        # Read back — exit 0, prints value
        run_capture_stdout 0 "$output" ../../bin/lthn state get config host
        assert_equals "homelab" "$output"
        EOF
