version: "3"

tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../../_lib/run.sh

        isolate_home
        output="$(mktemp)"
        trap "rm -f $output; rm -rf $LTHN_TEST_HOME" EXIT

        # Missing args — exit 2
        run_capture_all 2 "$output" ../../bin/lthn state delete config
        assert_contains "usage" "$output"

        # Seed two
        ../../bin/lthn state set config host homelab
        ../../bin/lthn state set config port 8080

        # Delete one — exit 0
        run_capture_all 0 "$output" ../../bin/lthn state delete config host

        # The deleted key no longer comes back via list
        run_capture_stdout 0 "$output" ../../bin/lthn state list config
        assert_not_contains "homelab" "$output"
        assert_contains "8080" "$output"
        EOF
