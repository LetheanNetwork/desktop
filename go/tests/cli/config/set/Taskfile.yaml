version: "3"

tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../../_lib/run.sh

        isolate_home
        output="$(mktemp)"
        trap "rm -f $output; rm -rf $LTHN_TEST_HOME" EXIT

        # `lthn config set` with missing args — exit 2
        run_capture_all 2 "$output" ../../bin/lthn config set
        assert_contains "usage" "$output"

        # Missing VALUE — exit 2
        run_capture_all 2 "$output" ../../bin/lthn config set transport.port
        assert_contains "usage" "$output"

        # Good path — exit 0, writes yaml file
        run_capture_all 0 "$output" ../../bin/lthn config set transport.port 8080
        test -f "$LTHN_TEST_HOME/Lethean/conf/lthn.yaml"
        assert_contains "8080" "$LTHN_TEST_HOME/Lethean/conf/lthn.yaml"
        EOF
