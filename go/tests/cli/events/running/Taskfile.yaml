version: "3"

tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../../_lib/run.sh

        isolate_home
        output="$(mktemp)"
        trap "rm -f $output; rm -rf $LTHN_TEST_HOME" EXIT

        # Exit 0, prints either "running" or "stopped" (depends on hub
        # goroutine race in one-shot CLI mode — both are valid).
        run_capture_stdout 0 "$output" ../../bin/lthn events running
        grep -Eq '^(running|stopped)$' "$output"
        EOF
