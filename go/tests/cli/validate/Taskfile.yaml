version: "3"

tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../_lib/run.sh

        isolate_home
        output="$(mktemp)"
        trap "rm -f $output; rm -rf $LTHN_TEST_HOME" EXIT

        # Missing URL — exit 2
        run_capture_all 2 "$output" ../bin/lthn validate
        assert_contains "usage" "$output"

        # Unreachable endpoint — exit 1, ok:false in JSON
        run_capture_all 1 "$output" ../bin/lthn validate "http://127.0.0.1:1"
        assert_jq '.ok == false' "$output"
        assert_jq '.status == 0' "$output"

        # Reachable endpoint — spin up the local serve as a probe target.
        port=$((40000 + RANDOM % 20000))
        ../bin/lthn serve --port "$port" >/dev/null 2>&1 &
        pid=$!
        cleanup() {
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          rm -f "$output"
          rm -rf "$LTHN_TEST_HOME"
        }
        trap cleanup EXIT

        for i in $(seq 1 50); do
          if curl -sS -o /dev/null "http://127.0.0.1:$port/health" 2>/dev/null; then break; fi
          sleep 0.1
        done

        # The lthn server responds on /v1/models with 200 — counts as ok:true
        run_capture_stdout 0 "$output" ../bin/lthn validate "http://127.0.0.1:$port/v1"
        assert_jq '.ok == true' "$output"
        assert_jq '.status == 200' "$output"
        EOF
