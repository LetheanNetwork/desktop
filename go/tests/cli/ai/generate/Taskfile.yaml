version: "3"

tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../../_lib/run.sh

        isolate_home
        output="$(mktemp)"
        trap "rm -f $output; rm -rf $LTHN_TEST_HOME" EXIT

        # Missing PROMPT — exit 2
        run_capture_all 2 "$output" ../../bin/lthn ai generate
        assert_contains "usage" "$output"

        # No routes configured — falls back to echo stub
        run_capture_stdout 0 "$output" ../../bin/lthn ai generate "write a haiku"
        assert_contains "[lthn stub]" "$output"
        assert_contains "write a haiku" "$output"
        EOF
