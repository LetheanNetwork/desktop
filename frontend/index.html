<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport — Wails WebView lives inside a native OS window so the
       mobile-style viewport meta doesn't matter for layout, but
       initial-scale=1.0 + viewport-fit=cover keep DevTools-on-iOS
       behaviour sane and stop any user-zoom drift if the embedded
       WebView ever inherits a pinch gesture from the host. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- colour-scheme: dark — hints to the WebView's form controls,
       scrollbars, and native dialog chrome that this is a dark app
       so they render with dark defaults instead of light. -->
  <meta name="color-scheme" content="dark" />
  <title>lthn</title>
  <link rel="stylesheet" href="/src/tokens.css" />
  <link rel="stylesheet" href="/fontawesome/css/all.min.css" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--surf-0, #0a0a0e);
      color: var(--fg-0, #f0f0f5);
      font-family: var(--font-sans, "Geist", system-ui);
      font-size: 14px;
      line-height: 1.45;

      /* Retina text rendering — the macOS WebView defaults to
         subpixel-antialiased which makes thin light-on-dark text
         look heavier and slightly blurry. The `antialiased` /
         `grayscale` pair plus `optimizeLegibility` gives crisp,
         even strokes at 2× and 3× DPR. Without these the chat
         body + sidebar labels feel cramped on retina displays. */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: "kern" 1, "liga" 1, "calt" 1;

      /* Kill the macOS WebKit rubber-band overscroll — every named
         lthn window has internal scrolling where needed; the OS
         shouldn't bounce the whole page when content fits. */
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
    }
    #app { height: 100%; overscroll-behavior: none; }
  </style>
  <!-- Bridge shim — forwards console + window.error + unhandledrejection
       to the local MCP bridge via the Wails Events bus ("lthn:console" /
       "lthn:error"), and publishes window.__lthnEmit so the bridge's
       ExecJS-injected eval wrap (core/gui taskEvalJS) can emit its
       "lthn:eval-reply" through the SAME resolved emitter. The bridge
       subscribes to all three on the Go side via core/gui's
       CustomEventBinder / BindEvalReply.

       MUST be type="module": "@wailsio/runtime" is a bare specifier
       that only resolves through vite's module transform (exactly how
       main.ts reaches it). A classic <script>'s runtime import keeps
       the literal specifier, the browser can't resolve it, and the
       emitter stays null — which silently killed console, error AND
       eval capture before this fix. Events emitted before the runtime
       import settles are queued and flushed on resolve. Silent (no
       throw, no flush) when no runtime is present — canvas-preview /
       unit tests. See pkg/bridge/ + core/gui pkg/window. -->
  <script type="module">
    (function () {
      // emitter is null until the @wailsio/runtime import settles; emit
      // queues until then so the earliest console lines / the shim-ready
      // diagnostic aren't lost to the boot race.
      var emitter = null;
      var queue = [];
      var emit = function (name, payload) {
        if (emitter) { try { emitter(name, payload); } catch (_) {} return; }
        if (queue.length < 256) queue.push([name, payload]);
      };
      // Published for the bridge eval wrap — an ExecJS classic script
      // can't import bare specifiers, so it reuses this emitter.
      window.__lthnEmit = emit;
      import('@wailsio/runtime').then(function (rt) {
        if (rt && rt.Events && typeof rt.Events.Emit === 'function') {
          emitter = function (n, p) { rt.Events.Emit(n, p); };
          var q = queue; queue = [];
          for (var i = 0; i < q.length; i++) {
            try { emitter(q[i][0], q[i][1]); } catch (_) {}
          }
        }
      }).catch(function () { /* no Wails runtime (canvas-preview / tests) — stay silent */ });
      var fmt = function (args) {
        return Array.prototype.map.call(args, function (a) {
          if (a === null || a === undefined) return String(a);
          if (typeof a === 'string') return a;
          if (a instanceof Error) {
            return (a.name || 'Error') + ': ' + (a.message || '(no message)') +
              (a.stack ? '\n' + a.stack : '');
          }
          if (typeof a === 'object' && (a.stack || a.message)) {
            return (a.name || 'object') + ': ' + (a.message || '') +
              (a.stack ? '\n' + a.stack : '');
          }
          try { return JSON.stringify(a); } catch (e) { return String(a); }
        }).join(' ');
      };
      ['log', 'info', 'warn', 'error', 'debug'].forEach(function (level) {
        var orig = console[level].bind(console);
        console[level] = function () {
          orig.apply(console, arguments);
          emit('lthn:console', {
            level: level,
            message: fmt(arguments),
            source: 'console',
            at: new Date().toISOString(),
          });
        };
      });
      window.addEventListener('error', function (e) {
        emit('lthn:error', {
          message: e.message || 'unknown error',
          source: e.filename || '',
          line: e.lineno || 0,
          col: e.colno || 0,
          stack: (e.error && e.error.stack) || '',
          at: new Date().toISOString(),
        });
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        emit('lthn:error', {
          message: 'unhandled promise rejection: ' + (reason && reason.message ? reason.message : String(reason)),
          stack: (reason && reason.stack) || '',
          at: new Date().toISOString(),
        });
      });
      // Diagnostic — emitted immediately; queues until the runtime
      // import settles, then flushes. Its arrival in the bridge console
      // buffer is the end-to-end proof that JS→Go emit works.
      emit('lthn:console', {
        level: 'info',
        message: 'lthn shim ready (module emit path)',
        source: 'shim',
        at: new Date().toISOString(),
      });
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
