<div
  class="shell"
  role="status"
  aria-label="Loading Lethean Desktop"
  i18n-aria-label="Loading state label@@appShell.loadingLabel"
>
  <header class="menubar">
    <span class="brand">
      <span class="brand-mark" aria-hidden="true">L</span>
      <ng-container i18n="Product name@@brand.lethean">Lethean</ng-container>
    </span>
    <span class="menu" i18n="Loading shell menu@@appShell.menu.desktop">Desktop</span>
    <span class="menu" i18n="Loading shell menu@@appShell.menu.view">View</span>
    <span class="menu" i18n="Loading shell menu@@appShell.menu.window">Window</span>
    <span class="status" aria-hidden="true"> <i></i><i></i><i></i> </span>
  </header>

  <main class="workspace">
    <section class="window" aria-hidden="true">
      <div class="titlebar">
        <span class="lights"><i></i><i></i><i></i></span>
        <span class="title" i18n="Application title@@appShell.title">Lethean Desktop</span>
      </div>
      <div class="window-body">
        <span class="pulse logo">L</span>
        <span class="pulse line wide"></span>
        <span class="pulse line"></span>
      </div>
    </section>
  </main>

  <footer class="dock" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></footer>
</div>
