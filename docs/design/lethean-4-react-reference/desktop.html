<!doctype html>
<html lang="en" data-brand="lethean" data-platform="darwin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lethean Desktop — Week-of design lane</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; background: #0c0b10; color: #e7e5ee; font-family: var(--font-sans); }
  body { min-height: 100vh; }
</style>
<script>
  // Suppress benign ResizeObserver loop warning from pan/zoom canvas
  window.addEventListener("error", (e) => {
    if (e.message && e.message.includes("ResizeObserver loop")) {
      e.stopImmediatePropagation();
      e.preventDefault();
    }
  });
</script>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="desktop-panel.jsx"></script>
<script type="text/babel" src="desktop-spec.jsx"></script>
<script type="text/babel" src="windows-chrome.jsx"></script>
<script type="text/babel" src="windows-chat.jsx"></script>
<script type="text/babel" src="windows-ops.jsx"></script>
<script type="text/babel" src="windows-obs.jsx"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "menubarTheme": "both",
  "showCursor": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme = tweaks.menubarTheme || "both";
  const showCursor = tweaks.showCursor !== false;

  return (
    <>
      <DesignCanvas defaultZoom={0.5}>
        <DCSection id="brief" title="Lethean Desktop — week-of brief" subtitle="P0 surface for the first public release · designed against RFC.first-release.md §4">
          <DCArtboard id="intro" label="00 · Brief · what's in scope this week" width={1280} height={520}>
            <BriefIntroCard />
          </DCArtboard>
        </DCSection>

        <DCSection id="tray-icon" title="P0.1 · Tray icon" subtitle="Lethean glyph at menu-bar size · monochrome template-image · static + active variants">
          <DCArtboard id="icon-spec" label="D1 · Icon family · 4 SVGs + construction grid" width={1280} height={620}>
            <IconSpecCard />
          </DCArtboard>
          <DCArtboard id="menubar-dark" label="D2 · macOS menu bar · dark · static + active" width={1280} height={120}>
            <div style={{ padding: "20px 24px", background: "var(--surface-0)", height: "100%", display: "flex", flexDirection: "column", gap: 16 }}>
              <MenubarStrip theme="dark" active={false} label="Dark menu bar · idle" />
            </div>
          </DCArtboard>
          <DCArtboard id="menubar-dark-active" label="D3 · Dark · active (model loaded)" width={1280} height={120}>
            <div style={{ padding: "20px 24px", background: "var(--surface-0)", height: "100%", display: "flex", flexDirection: "column", gap: 16 }}>
              <MenubarStrip theme="dark" active={true} label="Dark menu bar · active · runner dot visible" />
            </div>
          </DCArtboard>
          <DCArtboard id="menubar-light" label="D4 · Light menu bar · idle" width={1280} height={120}>
            <div style={{ padding: "20px 24px", background: "var(--surface-0)", height: "100%", display: "flex", flexDirection: "column", gap: 16 }}>
              <MenubarStrip theme="light" active={false} label="Light menu bar · idle" />
            </div>
          </DCArtboard>
          <DCArtboard id="menubar-light-active" label="D5 · Light · active" width={1280} height={120}>
            <div style={{ padding: "20px 24px", background: "var(--surface-0)", height: "100%", display: "flex", flexDirection: "column", gap: 16 }}>
              <MenubarStrip theme="light" active={true} label="Light menu bar · active · runner dot visible" />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="panel-context" title="P0.2 · Tray popover in context" subtitle="Anchored to the menu-bar lthn icon · 400 × 560 · no internal navigation">
          <DCArtboard id="panel-anchor" label="D6 · Popover anchored to menu-bar icon · ready state" width={1280} height={760}>
            <div style={{
              padding: "0", background: "var(--surface-0)", height: "100%",
              display: "flex", flexDirection: "column",
            }}>
              <MenubarStrip theme="dark" active={true} showPopover={true} popoverState="ready" />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="states" title="P0.3 · Five state variants" subtitle="Same panel, every meaningful state the runner moves through">
          <DCArtboard id="state-first-run" label="D7 · First-run · no model" width={460} height={680}>
            <div style={{ background: "var(--surface-0)", height: "100%", padding: "20px 30px", display: "flex", flexDirection: "column", alignItems: "center" }}>
              <StateMock state="first-run" name="01 · First-run"
                blurb="No model present. Prompt + stats are disabled; the panel teaches what to do next without shouting." />
            </div>
          </DCArtboard>
          <DCArtboard id="state-loading" label="D8 · Loading model" width={460} height={680}>
            <div style={{ background: "var(--surface-0)", height: "100%", padding: "20px 30px", display: "flex", flexDirection: "column", alignItems: "center" }}>
              <StateMock state="loading" name="02 · Loading"
                blurb="Memory growing as the model maps in. Amber dot in the footer · prompt stays locked until ready." />
            </div>
          </DCArtboard>
          <DCArtboard id="state-ready" label="D9 · Model ready · idle" width={460} height={680}>
            <div style={{ background: "var(--surface-0)", height: "100%", padding: "20px 30px", display: "flex", flexDirection: "column", alignItems: "center" }}>
              <StateMock state="ready" name="03 · Ready · idle" showCursor={showCursor}
                blurb="Model loaded, idle watts in the strip. Last response remains visible until cleared. Green dot · airplane-mode OK." />
            </div>
          </DCArtboard>
          <DCArtboard id="state-generating" label="D10 · Generating · live" width={460} height={680}>
            <div style={{ background: "var(--surface-0)", height: "100%", padding: "20px 30px", display: "flex", flexDirection: "column", alignItems: "center" }}>
              <StateMock state="generating" name="04 · Generating"
                blurb="Stats live · sparkline pulse on the head dot · output streams with brand-violet cursor. Footer dot pulses." />
            </div>
          </DCArtboard>
          <DCArtboard id="state-error" label="D11 · Error" width={460} height={680}>
            <div style={{ background: "var(--surface-0)", height: "100%", padding: "20px 30px", display: "flex", flexDirection: "column", alignItems: "center" }}>
              <StateMock state="error" name="05 · Error"
                blurb="Inline toast names what went wrong and offers the fix. No apologies. Stats freeze at last good values · red dot in footer." />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="sparkline" title="P0.4 · Sparkline" subtitle="Inline tok/s history · anatomy + spec">
          <DCArtboard id="sparkline-spec" label="D12 · Sparkline · 60 × 20 · animation spec" width={1280} height={560}>
            <SparklineSpecCard />
          </DCArtboard>
        </DCSection>

        <DCSection id="output" title="P0.5 · Generated output area" subtitle="Mono · selection · copy · code blocks">
          <DCArtboard id="output-spec" label="D13 · Output surface · spec + live mock" width={1280} height={640}>
            <OutputSpecCard />
          </DCArtboard>
        </DCSection>

        <DCSection id="e0-chat" title="E0 · Chat window — the first expansion" subtitle="Full-conversation surface that hangs off the tray. 1100×740 default. Closing it does NOT quit lthn — the runner keeps running.">
          <DCArtboard id="chat-multi" label="W1 · Chat · multi-turn · right rail expanded" width={1140} height={780}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <ChatWindow state="multi-turn" rightRail="expanded" rail="filled" />
            </div>
          </DCArtboard>
          <DCArtboard id="chat-empty" label="W2 · Chat · empty / first conversation" width={1140} height={780}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <ChatWindow state="empty" rightRail="collapsed" rail="empty" />
            </div>
          </DCArtboard>
          <DCArtboard id="chat-generating" label="W3 · Chat · mid-generation" width={1140} height={780}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <ChatWindow state="generating" rightRail="expanded" rail="filled" />
            </div>
          </DCArtboard>
          <DCArtboard id="chat-switched" label="W4 · Chat · switched-model warning · KV reset" width={1140} height={780}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <ChatWindow state="switched-model" rightRail="collapsed" rail="filled" />
            </div>
          </DCArtboard>
          <DCArtboard id="chat-no-model" label="W5 · Chat · model not loaded" width={1140} height={780}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <ChatWindow state="no-model" rightRail="collapsed" rail="filled" />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="e1-ops" title="E1 · Operational windows" subtitle="Settings · Welcome · Model browser. The windows the user touches to configure and prepare. Sectioned scroll, never tabbed (a section is open-able; tabs aren't).">
          <DCArtboard id="welcome-1" label="W6 · Welcome · step 1 · pick model directory" width={800} height={620}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <WelcomeWindow step={1} />
            </div>
          </DCArtboard>
          <DCArtboard id="welcome-2" label="W7 · Welcome · step 2 · curated starter models" width={800} height={620}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <WelcomeWindow step={2} />
            </div>
          </DCArtboard>
          <DCArtboard id="welcome-3" label="W8 · Welcome · step 3 · connect clients" width={800} height={620}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <WelcomeWindow step={3} />
            </div>
          </DCArtboard>
          <DCArtboard id="settings" label="W9 · Settings · sectioned scroll" width={800} height={650}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <SettingsWindow />
            </div>
          </DCArtboard>
          <DCArtboard id="model-browser" label="W10 · Model browser · local · HF search · detail" width={1080} height={740}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <ModelBrowserWindow />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="e2-obs" title="E2 · Observability windows" subtitle="What the runtime is doing and how well. Benchmark · activity log · live telemetry — the trifecta that lets a user *show* the sovereign-compute story.">
          <DCArtboard id="benchmark" label="W11 · Benchmark · history + tok/s vs context" width={1040} height={700}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <BenchmarkWindow />
            </div>
          </DCArtboard>
          <DCArtboard id="logs-live" label="W12 · Activity · live log" width={1040} height={700}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <LogsWindow tab="live" />
            </div>
          </DCArtboard>
          <DCArtboard id="logs-history" label="W13 · Activity · generation history" width={1040} height={700}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <LogsWindow tab="history" />
            </div>
          </DCArtboard>
          <DCArtboard id="logs-power" label="W14 · Activity · power history · 24h" width={1040} height={700}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <LogsWindow tab="power" />
            </div>
          </DCArtboard>
          <DCArtboard id="telemetry" label="W15 · Live telemetry · the demo surface" width={920} height={600}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <TelemetryWindow />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="e3-integ" title="E3 · Integration windows" subtitle="Clients · MCP tools. Lthn's reach into the broader developer ecosystem — wired in only when the user opts in.">
          <DCArtboard id="integrations" label="W16 · Integrations · per-client status + config preview" width={920} height={700}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <IntegrationsWindow />
            </div>
          </DCArtboard>
          <DCArtboard id="tools-mcp" label="W17 · Tools · MCP · servers · schema · try-it" width={1080} height={740}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <ToolsWindow />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="e4-future" title="E4 · Future expansion concepts" subtitle="Sketches for when the substrates land — LetherNet (v0.7+), fine-tune (when SFT UI is ready), fleet (when multi-machine ships). Listed here so the extension pattern is visible.">
          <DCArtboard id="network" label="W18 · Network · disaggregated inference · LetherNet v0.7" width={1120} height={760}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <NetworkWindow />
            </div>
          </DCArtboard>
          <DCArtboard id="distillation" label="W19 · Fine-tune · LoRA · live loss · publish" width={1140} height={780}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <DistillationWindow />
            </div>
          </DCArtboard>
          <DCArtboard id="fleet" label="W20 · Fleet · multi-machine · live queue" width={1120} height={740}>
            <div style={{ padding: 20, background: "var(--surface-0)", height: "100%", display: "flex", justifyContent: "center", alignItems: "center" }}>
              <FleetWindow />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="open-questions" title="Open questions for Snider" subtitle="§6 of the brief · my proposed call beside each · flag any to revisit">
          <DCArtboard id="q-card" label="D14 · 8 decisions · my call · revisit if needed" width={1280} height={720}>
            <OpenQuestionsCard />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Live cursor in mocks">
          <TweakToggle
            label="Show cursor in idle prompt"
            value={showCursor}
            onChange={(v) => setTweak("showCursor", v)}
          />
          <div style={{ fontSize: 11.5, color: "rgba(255,255,255,0.55)", marginTop: 6, lineHeight: 1.45 }}>
            Useful when reviewing whether the cursor reads as "ready for input" without distracting from the rest of the panel.
          </div>
        </TweakSection>
        <TweakSection title="System">
          <div style={{ fontSize: 11.5, color: "rgba(255,255,255,0.55)", lineHeight: 1.5 }}>
            data-brand="lethean" · data-platform="darwin" · SF Pro · brand hue 270 · Lethean-3 surface tokens · British English everywhere.
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
