# Sonar config for lthn/desktop — https://sonar.lthn.sh/dashboard?id=lthn_desktop
#
# Local scan: sonar-scanner -Dsonar.token="$(cat ~/.claude/secrets/sonarqube_lthn_desktop_token)"
# CI: SONAR_TOKEN repo secret + sonar-scanner GitHub Action.

sonar.projectKey=lthn_desktop
sonar.projectName=lthn/desktop
sonar.host.url=https://sonar.lthn.sh

# Sources — Go server + Angular frontend + bash scripts.
sonar.sources=go,frontend/src,build

# Tests — Go _test.go + vitest *.test.ts colocated under the same trees.
sonar.tests=go,frontend/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts

# Excluded: submodules (not our code), generated bindings, build outputs,
# node_modules, public asset dump, the canonical zip drop for design.
sonar.exclusions=external/**,frontend/node_modules/**,frontend/bindings/**,frontend/public/**,bin/**,build/bin/**,build/sdk/**,build/android/**,docs/design/**,plans/**,**/*.java

# Coverage hooks (populated by the audit script when it lands coverage emit).
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
