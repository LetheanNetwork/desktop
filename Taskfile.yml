version: '3'

# lthn — Lethean Desktop. Wails3-canonical Taskfile structure,
# adapted for the Lethean go/ subfolder layout and Angular frontend.
# The platform task files in build/{darwin,
# linux,windows,ios,android}/Taskfile.yml all build the same cmd/lthn
# product entrypoint; the mobile tasks additionally generate Wails overlays.
#
# Our module lives at go/ (Lethean canon). Adaptations live in this
# top file: BIN_DIR points outside go/, the go build / go work sync
# / wails3 generate bindings commands all `cd go` first.
#
# Common verbs:
#
#   task build        # OS-detect → build/{OS}:build
#   task dev          # wails3 dev orchestrator (hot reload)
#   task run          # build + launch the .app
#   task package      # OS-detect → build/{OS}:package
#
# CLI-suite tests (unaffected by Wails):
#
#   cd go/tests/cli && task test

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

vars:
  APP_NAME: "lthn"
  BIN_DIR: "bin"
  # Wails exposes this as WAILS_VITE_PORT even when the proxied frontend
  # server is Angular rather than Vite.
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Where the Go module + cmd live (Lethean canon: go/ subfolder).
  GO_DIR: "go"
  GO_CMD: "./cmd/lthn"
  # Run the Wails CLI through the Go module's tool directive so the runtime,
  # generator, and orchestrator cannot drift from go/go.mod.
  WAILS3_TOOL: '{{.WAILS3_TOOL | default "go tool wails3"}}'
  # The native Wails/CoreGO objects are built for macOS 26. Keep the Go
  # link target and bundle metadata aligned with that real product floor.
  MACOS_DEPLOYMENT_TARGET: "26.0"
  # Where the go-mlx repo lives. Override with LTHN_MLX_REPO env var
  # if go-mlx is checked out elsewhere on this machine.
  LTHN_MLX_REPO: '{{.LTHN_MLX_REPO | default "/Users/snider/Code/core/go-mlx"}}'
  # Where the core/agent repo lives (the lthn-agent crew member).
  # Override with LTHN_AGENT_REPO if checked out elsewhere.
  LTHN_AGENT_REPO: '{{.LTHN_AGENT_REPO | default "/Users/snider/Code/core/agent"}}'
  # Where the core/go-ai repo lives (the lthn-ai host crew member).
  # Override with LTHN_AI_REPO if checked out elsewhere.
  LTHN_AI_REPO: '{{.LTHN_AI_REPO | default "/Users/snider/Code/core/go-ai"}}'
  # LEM is the manually-started local model runtime. Production packages use
  # a fixed sibling binary; they never discover it through PATH. A matching
  # prebuilt binary can be supplied by CI with LTHN_LEM_BIN.
  LTHN_LEM_REPO: '{{.LTHN_LEM_REPO | default "/Users/snider/Code/core/go-inference"}}'
  LTHN_LEM_BIN: '{{.LTHN_LEM_BIN | default ""}}'
  LEM_BINARY_NAME: '{{if eq OS "windows"}}lem.exe{{else}}lem{{end}}'
  LEM_STAGE_PATH: 'build/{{OS}}/bin/{{.LEM_BINARY_NAME}}'

tasks:
  build:
    summary: Builds the application (OS-detect) after pre-build prep
    deps: [pre-build]
    cmds:
      - task: "{{OS}}:build"

  lthn:
    summary: All-in-one — prep the ground (pre-build) then build + package the distributable bundle
    deps: [pre-build]
    cmds:
      - task: package

  pre-build:
    summary: "Prep the ground before the wails3 OS build — stage optional sidecars (LEM, lthn-mlx, lthn-agent, lthn-ai) + install frontend deps"
    deps:
      - build:lem
      - build:lthn-mlx
      - build:lthn-agent
      - build:lthn-ai
      - common:install:frontend:deps

  build:lem:
    summary: Build or copy the host-platform LEM runtime into its package staging directory
    desc: |
      LEM remains optional and manual-by-default. LTHN_LEM_BIN supplies a
      prebuilt matching-platform binary; otherwise the supported go-inference
      task builds from LTHN_LEM_REPO. macOS uses the self-contained embedded
      Metal build, while Linux and Windows use the portable native build.
      Missing optional source leaves the desktop package usable without model
      runtime support. There is deliberately no PATH fallback.
    cmds:
      - cmd: |-
          set -e
          REPO="{{.LTHN_LEM_REPO}}"
          SOURCE="{{.LTHN_LEM_BIN}}"
          STAGE="{{.LEM_STAGE_PATH}}"
          NAME="{{.LEM_BINARY_NAME}}"
          if [ -z "$SOURCE" ]; then
            if [ ! -f "$REPO/Taskfile.yml" ]; then
              echo "  LEM sidecar: optional runtime unavailable; build it or set LTHN_LEM_BIN"
              exit 0
            fi
            ( cd "$REPO" && {{if eq OS "darwin"}}task build:embed{{else}}task build:native{{end}} )
            SOURCE="$REPO/bin/$NAME"
          fi
          if [ ! -f "$SOURCE" ]; then
            echo "  LEM sidecar: optional runtime unavailable; build it or set LTHN_LEM_BIN"
            exit 0
          fi
          mkdir -p "$(dirname "$STAGE")"
          cp "$SOURCE" "$STAGE"
          chmod 0755 "$STAGE"
          echo "  LEM sidecar → $STAGE"
        platforms: [darwin, linux]
      - cmd: |-
          powershell -NoProfile -Command "& {
            $repo = '{{.LTHN_LEM_REPO}}'
            $source = '{{.LTHN_LEM_BIN}}'
            $stage = '{{.LEM_STAGE_PATH}}'
            if ([string]::IsNullOrWhiteSpace($source)) {
              if (-not (Test-Path -LiteralPath (Join-Path $repo 'Taskfile.yml') -PathType Leaf)) {
                Write-Output '  LEM sidecar: optional runtime unavailable; build it or set LTHN_LEM_BIN'
                exit 0
              }
              Push-Location $repo
              try { task build:native } finally { Pop-Location }
              $source = Join-Path $repo 'bin/lem.exe'
            }
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              Write-Output '  LEM sidecar: optional runtime unavailable; build it or set LTHN_LEM_BIN'
              exit 0
            }
            New-Item -ItemType Directory -Force (Split-Path -Parent $stage) | Out-Null
            Copy-Item -LiteralPath $source -Destination $stage -Force
            Write-Output \"  LEM sidecar -> $stage\"
          }"
        platforms: [windows]

  build:lthn-mlx:
    summary: Build the self-contained lthn-mlx (embedded metallib) into build/darwin/bin
    desc: |
      Builds lthn-mlx via go-mlx's `task build:lthn`, which embeds the
      gzipped metallib (-tags embed_metallib) so the binary is fully
      self-contained — no sibling metallib, no .app wrapper, runs from
      any path. Stages the single binary at build/darwin/bin/lthn-mlx for
      the packager to drop into Contents/MacOS. Skips gracefully if go-mlx
      can't produce it (e.g. metallib not built) so a GUI-only build still
      succeeds (the packager then expects lthn-mlx on PATH at runtime).
    status:
      - test -x "build/darwin/bin/lthn-mlx"
    cmds:
      - |-
        set -e
        REPO="{{.LTHN_MLX_REPO}}"
        if [ ! -f "$REPO/dist/lib/mlx.metallib" ]; then
          echo "  lthn-mlx: no metallib at $REPO/dist/lib/mlx.metallib — skipping"
          echo "  build it first: (cd $REPO && cmake --build build --target install)"
          exit 0
        fi
        ( cd "$REPO" && task build:lthn )
        mkdir -p build/darwin/bin
        cp "$REPO/bin/lthn-mlx" build/darwin/bin/lthn-mlx
        echo "  lthn-mlx (self-contained) → build/darwin/bin/lthn-mlx"

  build:lthn-agent:
    summary: Build the lthn-agent crew member into build/darwin/bin
    desc: |
      Builds lthn-agent via core/agent's `task build:lthn` and stages the
      single binary at build/darwin/bin/lthn-agent for the packager to
      drop into Contents/MacOS. The crew's agentic-dispatch member —
      lthn-ai manages instances of it, lthn supervises the set via
      go-process. Skips gracefully if core/agent isn't checked out so a
      GUI-only build still succeeds.
    status:
      - test -x "build/darwin/bin/lthn-agent"
    cmds:
      - |-
        set -e
        REPO="{{.LTHN_AGENT_REPO}}"
        if [ ! -d "$REPO/go/cmd/core-agent" ]; then
          echo "  lthn-agent: no core/agent at $REPO — skipping"
          exit 0
        fi
        ( cd "$REPO" && task build:lthn )
        mkdir -p build/darwin/bin
        cp "$REPO/bin/lthn-agent" build/darwin/bin/lthn-agent
        echo "  lthn-agent → build/darwin/bin/lthn-agent"

  build:lthn-ai:
    summary: Build the lthn-ai host into build/darwin/bin
    desc: |
      Builds lthn-ai (the LEM Runtime host — MCP + embeddings + State +
      the driver-orchestration surface at /v1/driver and the
      /v1/chat/completions proxy) and stages it at build/darwin/bin/lthn-ai
      for the packager. lthn-ai supervises the model driver (lthn-mlx) over
      go-process and proxies chat to it; the desktop crew supervises lthn-ai.
      go-ai has no Taskfile, so this builds ./cmd/lthn-ai directly into the
      staging dir. Skips gracefully if go-ai isn't checked out so a GUI-only
      build still succeeds. No status guard — go build is incremental, so this
      re-stages a fresh binary every pre-build, avoiding the stale-sidecar trap a
      `test -x` existence check creates when the source changes.
    cmds:
      - |-
        set -e
        REPO="{{.LTHN_AI_REPO}}"
        DEST="$(pwd)/build/darwin/bin"
        if [ ! -d "$REPO/go/cmd/lthn-ai" ]; then
          echo "  lthn-ai: no go-ai at $REPO — skipping"
          exit 0
        fi
        mkdir -p "$DEST"
        ( cd "$REPO/go" && go build -trimpath -o "$DEST/lthn-ai" ./cmd/lthn-ai )
        echo "  lthn-ai → build/darwin/bin/lthn-ai"

  package:
    summary: Packages a production build
    deps: [pre-build]
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Build + launch the application
    cmds:
      - task: "{{OS}}:run"

  dev:build:
    summary: Compile the host-native development binary without rebuilding the HMR frontend or optional crew sidecars
    deps:
      - common:go:work:sync
      - common:generate:icons
    cmds:
      - cmd: mkdir -p "{{.BIN_DIR}}"
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force '{{.BIN_DIR}}' | Out-Null"
        platforms: [windows]
      - cd "{{.GO_DIR}}" && go build {{.BUILD_FLAGS}} -ldflags "-X dappco.re/go/update.Version={{.LTHN_VERSION}}" -o "../{{.OUTPUT}}" "{{.GO_CMD}}"
    vars:
      BUILD_FLAGS: '{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"'
      LTHN_VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
      OUTPUT: '{{if eq OS "windows"}}{{.BIN_DIR}}/{{.APP_NAME}}.exe{{else}}{{.BIN_DIR}}/{{.APP_NAME}}{{end}}'
    env:
      MACOSX_DEPLOYMENT_TARGET: '{{if eq OS "darwin"}}{{.MACOS_DEPLOYMENT_TARGET}}{{end}}'
      CGO_CFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min={{.MACOS_DEPLOYMENT_TARGET}}{{end}}'
      CGO_CXXFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min={{.MACOS_DEPLOYMENT_TARGET}}{{end}}'
      CGO_LDFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min={{.MACOS_DEPLOYMENT_TARGET}} -Wl,-no_warn_duplicate_libraries{{end}}'

  dev:
    summary: Wails3 dev mode with Angular HMR and the built-in MCP service on 127.0.0.1:9099
    env:
      LTHN_DEV: "1"
      # The built-in Wails MCP server is compiled out unless this tag is
      # present. Keep it on the development route only; release builds must
      # retain Wails' zero-port, zero-attack-surface default.
      EXTRA_TAGS: "mcp"
    cmds:
      - '{{.WAILS3_TOOL}} dev -config ./build/config.yml -port {{.VITE_PORT}}'

  doctor:
    summary: Check the local toolchain, generated frontend inputs, optional crew repositories, and development ports
    cmds:
      - node scripts/dev-doctor.mjs

  test:
    summary: Run every test suite — Go pkg/* + frontend Vitest
    deps: [test:go, test:frontend]

  test:go:
    summary: Run the Go unit-test suite under go/pkg/...
    cmds:
      - cd "{{.GO_DIR}}" && go test ./pkg/...
    env:
      MACOSX_DEPLOYMENT_TARGET: '{{if eq OS "darwin"}}{{.MACOS_DEPLOYMENT_TARGET}}{{end}}'
      CGO_CFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min={{.MACOS_DEPLOYMENT_TARGET}}{{end}}'
      CGO_CXXFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min={{.MACOS_DEPLOYMENT_TARGET}}{{end}}'
      CGO_LDFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min={{.MACOS_DEPLOYMENT_TARGET}} -Wl,-no_warn_duplicate_libraries{{end}}'

  lint:cousinvalidator:
    summary: "Run cousin-validator lint (forbid local isValid* outside pkg/paths/, Mantis #1505) — operator shortcut for focused run; task test:go already catches drift via the embedded test"
    cmds:
      - cd "{{.GO_DIR}}" && go test ./pkg/lint/cousinvalidator/...

  lint:serviceingress:
    summary: "Run service-ingress lint (exported *Service.X(id string) → core.PathJoin must call paths.IsValidID OR live in wails.go, Mantis #1609 — Cerberus #24 Finding 2) — operator shortcut for focused run; task test:go already catches drift via the embedded test"
    cmds:
      - cd "{{.GO_DIR}}" && go test ./pkg/lint/serviceingress/...

  test:frontend:
    summary: Run Angular Vitest plus frontend convergence contracts
    cmds:
      - cd frontend-ng && npm run test:ci
      - cd frontend-ng && npm run test:contracts

  verify:frontend:
    summary: Run the complete deterministic Angular confidence gate
    dir: frontend-ng
    cmds:
      - npm run verify

  test:cover:
    summary: Run both suites with coverage + emit reports an agent can read
    deps: [test:cover:go, test:cover:frontend]
    cmds:
      # Single-quoted so backticks aren't interpreted as command
      # substitution by the shell that Task forks to run cmds.
      - cmd: |-
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Coverage reports written to:"
          echo "    go/coverage.out          per-statement, go-tool format"
          echo "    go/coverage.html         line-by-line HTML"
          echo "    frontend-ng/coverage/    Angular Vitest coverage"
          echo ""
          echo "  Inspect via:"
          echo "    go tool cover -func=go/coverage.out      # per-function table"
          echo "    open go/coverage.html                    # macOS HTML viewer"
          echo "    frontend-ng/coverage/lcov.info           # Angular frontend LCOV"
          echo "═══════════════════════════════════════════════════════════════"

  test:cover:go:
    summary: Go coverage profile + HTML report for go/pkg/... — leaves the
      profile at go/coverage.out so an agent can parse it with
      `go tool cover -func=coverage.out` or feed it to codecov.
    cmds:
      - cd "{{.GO_DIR}}" && go test -coverprofile=coverage.out ./pkg/...
      - cd "{{.GO_DIR}}" && go tool cover -html=coverage.out -o coverage.html
      - cd "{{.GO_DIR}}" && go tool cover -func=coverage.out
    env:
      MACOSX_DEPLOYMENT_TARGET: '{{if eq OS "darwin"}}{{.MACOS_DEPLOYMENT_TARGET}}{{end}}'
      CGO_CFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min={{.MACOS_DEPLOYMENT_TARGET}}{{end}}'
      CGO_CXXFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min={{.MACOS_DEPLOYMENT_TARGET}}{{end}}'
      CGO_LDFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min={{.MACOS_DEPLOYMENT_TARGET}} -Wl,-no_warn_duplicate_libraries{{end}}'

  test:cover:frontend:
    summary: Angular frontend coverage (Vitest v8 → frontend-ng/coverage/)
    cmds:
      - cd frontend-ng && npm run test:ci

  api:spec:
    summary: Generate OpenAPI 3.1 spec from registered RouteGroups
      → build/sdk/openapi.yaml. Built from the live api.Engine
      so what ships in the binary is what the spec describes.
    cmds:
      - cd "{{.GO_DIR}}" && go run ./cmd/lthn api spec --format yaml --out ../build/sdk/openapi.yaml

  api:sdk:typescript:
    summary: Regenerate the @lthn/api TypeScript SDK from the live spec
      → build/sdk/typescript-fetch/. Requires openapi-generator-cli
      on PATH (`npm i -g @openapitools/openapi-generator-cli`) and a
      JDK (`brew install openjdk` on macOS).
    deps: [api:spec]
    cmds:
      - cd "{{.GO_DIR}}" && go run ./cmd/lthn api sdk typescript-fetch --out ../build/sdk --package lthn-api --spec ../build/sdk/openapi.yaml
