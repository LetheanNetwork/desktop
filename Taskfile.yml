version: "3"

# lthn — Lethean Desktop build/dev tasks.
#
#   task dev          # frontend dev server (Vite, port 5173)
#   task build        # production binary (preferred — go via `core build`)
#   task frontend     # build frontend only
#   task qa           # fmt + vet + test
#   task qa:full      # + race + vuln + security
#
# Architecture: the lthn binary is the tray-rooted process. See
# plans/project/lthn/desktop/RFC.first-release.md.

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  dev:
    desc: Start frontend dev server (Vite — design canvas)
    dir: frontend
    cmds:
      - npm install
      - npm run dev

  frontend:
    desc: Build frontend (Lit + Vite → frontend/dist) and stage for embed
    cmds:
      - cd frontend && npm install && npm run build
      - rm -rf go/cmd/lthn/dist
      - mkdir -p go/cmd/lthn/dist
      - cp -R frontend/dist/. go/cmd/lthn/dist/

  build:
    desc: Production build (frontend + go embed)
    deps: [frontend]
    cmds:
      - go build -o bin/lthn ./go/cmd/lthn

  qa:
    desc: Format + vet + test
    cmds:
      - gofmt -l go/
      - go vet ./go/...
      - go test ./go/...

  qa:full:
    desc: + race detector + vuln + security audit
    cmds:
      - gofmt -l go/
      - go vet ./go/...
      - go test -race ./go/...
      - which govulncheck >/dev/null && govulncheck ./go/... || echo "govulncheck not installed"

  darwin:build:
    desc: macOS build (signed .app bundle pending L codesigning config)
    deps: [frontend]
    cmds:
      - GOOS=darwin GOARCH=arm64 go build -o bin/lthn ./go/cmd/lthn

  darwin:package:
    desc: macOS .app bundle (TODO — wire via core/gui's wails3 package or hand-rolled)
    deps: [darwin:build]
    cmds:
      - echo "TODO — implement .app bundle packaging per core/gui's pattern"
