# Lethean Desktop — build, release, and the browser preview.
#
# There is one branch: main. `dev` is a maintained tag, not a branch — every
# push to main moves it, so the `dev` release is always "what main builds right
# now" and there is one place to get a nightly rather than a branch to keep
# in step.
#
# Triggers:
#   - push to main   → build, refresh the rolling `dev` prerelease, publish the
#                      browser preview to GitHub Pages
#   - tag `v*`       → build + a GitHub Release at that version
#   - pull request   → build only, nothing published
#   - manual dispatch
#
# Each target produces a single canonical artifact:
#   - macOS (arm64): bin/lthn.app (ad-hoc signed, .zip-bundled for upload)
#   - Linux (amd64): bin/lthn (raw ELF)
#   - Windows (amd64): bin/lthn.exe
#   - iOS Simulator (arm64): bin/lthn.app (ad-hoc signed, zipped)
#   - Android: bin/lthn.apk (arm64-v8a + x86_64, debug-key signed)
#
# Local builds: `task build` (auto-detects OS). CI mirrors that path
# via OS-specific wails3 Taskfile targets — no separate CI build logic
# to keep in sync.

name: build

on:
  push:
    branches: [ main ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Pages needs id-token to deploy; the release jobs raise contents themselves.
permissions:
  contents: read

env:
  GO_VERSION:   "1.26.2"
  NODE_VERSION: "22"   # Angular frontend toolchain

jobs:
  frontend:
    name: frontend verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum

      - name: Install Linux build deps
        uses: ./.github/actions/linux-webkit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-ng/package-lock.json

      - name: Install Task
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend-ng
        run: npm ci

      - name: Generate bindings
        run: go tool wails3 task common:generate:bindings

      - name: Verify frontend
        working-directory: frontend-ng
        run: npm run verify

  build:
    name: build (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os:        macos
            runner:    macos-26            # arm64; matches the native 26.0 floor
            artifact:  lthn-darwin-arm64
            ext:       .app
            # package, not build: `build` produces bin/lthn, `package` wraps it
            # into bin/lthn.app. The bundling step below zips the .app, so
            # building alone left it with nothing to find.
            task:      darwin:package
          - os:        linux
            runner:    ubuntu-latest
            artifact:  lthn-linux-amd64
            ext:       ""
            task:      linux:build
          - os:        windows
            runner:    windows-latest
            artifact:  lthn-windows-amd64
            ext:       .exe
            task:      windows:build
          - os:        ios
            runner:    macos-15
            artifact:  lthn-ios-simulator-arm64
            ext:       .app
            task:      ios:package
          - os:        android
            runner:    ubuntu-latest
            artifact:  lthn-android-universal
            ext:       .apk
            task:      android:package:fat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache:      true
          cache-dependency-path: go/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache:        npm
          cache-dependency-path: frontend-ng/package-lock.json

      - name: Install Linux build deps
        if: matrix.os == 'linux' || matrix.os == 'android'
        uses: ./.github/actions/linux-webkit

      - name: Set up Java
        if: matrix.os == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK and NDK
        if: matrix.os == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        if: matrix.os == 'android'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install Task
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        working-directory: frontend-ng
        run: npm ci

      # duckdb ships as prebuilt cgo bindings, and every file in
      # duckdb-go-bindings/lib/windows-amd64 imports "C". With cgo off the Go
      # toolchain excludes all of them and reports it as "build constraints
      # exclude all Go files", which reads like a platform the package does not
      # support rather than a missing C compiler. macOS and Linux runners
      # detect their system compiler and enable cgo on their own; Windows does
      # not, so it is stated here.
      - name: Enable cgo (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          gcc --version | head -1

      - name: Generate bindings (TypeScript)
        if: matrix.os != 'ios' && matrix.os != 'android'
        run: go tool wails3 task common:generate:bindings

      - name: Build
        run: go tool wails3 task ${{ matrix.task }}

      - name: Bundle macOS .app
        if: matrix.os == 'macos'
        run: |
          mkdir -p artifact
          # task darwin:build produces bin/lthn.app; zip preserves the
          # codesign + bundle structure across the upload boundary.
          ditto -c -k --keepParent bin/lthn.app artifact/lthn-darwin-arm64.zip

      - name: Stage Linux artifact
        if: matrix.os == 'linux'
        run: |
          mkdir -p artifact
          cp bin/lthn artifact/lthn-linux-amd64

      - name: Stage Windows artifact
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p artifact
          cp bin/lthn.exe artifact/lthn-windows-amd64.exe

      - name: Bundle iOS Simulator .app
        if: matrix.os == 'ios'
        run: |
          mkdir -p artifact
          ditto -c -k --keepParent bin/lthn.app artifact/lthn-ios-simulator-arm64.zip

      - name: Stage Android artifact
        if: matrix.os == 'android'
        run: |
          mkdir -p artifact
          cp bin/lthn.apk artifact/lthn-android-universal.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name:           ${{ matrix.artifact }}
          path:           artifact/*
          retention-days: 7
          if-no-files-found: error

  pages:
    name: browser preview → GitHub Pages
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages:    write
      id-token: write
    environment:
      name: github-pages
      url:  ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache:        npm
          cache-dependency-path: frontend-ng/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache:      true
          cache-dependency-path: go/go.sum

      - name: Install Linux build deps
        uses: ./.github/actions/linux-webkit

      - name: Install frontend dependencies
        working-directory: frontend-ng
        run: npm ci

      # frontend-ng/bindings is generated and gitignored, so the preview build
      # needs it made here the same way the desktop build does.
      - name: Generate bindings
        run: go tool wails3 task common:generate:bindings

      # The preview has no Go process behind it, so it has to be told rather
      # than left retrying a socket that will never answer. The app reads
      # __LTHN_CONNECTION__.offline before the query flag, which a static host
      # cannot supply.
      - name: Declare the preview offline
        working-directory: frontend-ng
        run: |
          set -e
          # /wails/transport.js is served by the Go binary. On a static host it
          # is a 404, so drop it rather than ship a broken script tag.
          sed -i '\#<script src="/wails/transport.js"></script>#d' src/index.html
          sed -i 's#</head>#  <script>globalThis.__LTHN_CONNECTION__={offline:true};</script>\n</head>#' src/index.html
          grep -q "__LTHN_CONNECTION__" src/index.html
          ! grep -q "wails/transport.js" src/index.html

      # A project page is served from /<repo>/, so the base href has to match or
      # every asset resolves against the user-page root. Routing is hash based,
      # which is why no 404 rewrite is needed.
      - name: Build the preview
        working-directory: frontend-ng
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      # angular.json points the build at go/cmd/lthn/dist so the binary can
      # embed it; that same output is what gets published.
      - name: Check the preview built
        run: test -f go/cmd/lthn/dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: go/cmd/lthn/dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  dev-release:
    name: rolling dev prerelease
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Flatten artifacts
        run: |
          find ./dist -type f -exec mv {} ./dist/ \; 2>/dev/null || true
          ls -la ./dist/

      # `dev` is a tag this job moves, not a branch anybody commits to. The
      # release is replaced in place so the download URL never changes and
      # "latest dev" means "what main builds now".
      - name: Refresh the dev prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   dev
          name:       dev (rolling — main)
          body: |
            Built from `main` at ${{ github.sha }}.

            This tag moves with every push to main; it is not a branch and not a
            version. For a fixed build take a `v*` release instead.

            Browser preview: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          prerelease: true
          files: |
            dist/lthn-darwin-arm64.zip
            dist/lthn-linux-amd64
            dist/lthn-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Flatten artifacts
        run: |
          find ./dist -type f -exec mv {} ./dist/ \; 2>/dev/null || true
          ls -la ./dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/lthn-darwin-arm64.zip
            dist/lthn-linux-amd64
            dist/lthn-windows-amd64.exe
            dist/lthn-ios-simulator-arm64.zip
            dist/lthn-android-universal.apk
          generate_release_notes: true
          draft:      false
          prerelease: ${{ contains(github.ref, '-') }}
