# Lethean Desktop — desktop and mobile build + artifact upload.
#
# Triggers:
#   - push to main / dev   → CI build, upload as workflow artifacts (7d retention)
#   - tag `v*`             → CI build + create GitHub Release with the binaries
#   - manual dispatch      → on-demand build (useful for PR sanity checks)
#
# Each target produces a single canonical artifact:
#   - macOS (arm64): bin/lthn.app (ad-hoc signed, .zip-bundled for upload)
#   - Linux (amd64): bin/lthn (raw ELF)
#   - Windows (amd64): bin/lthn.exe
#   - iOS Simulator (arm64): bin/lthn.app (ad-hoc signed, zipped)
#   - Android: bin/lthn.apk (arm64-v8a + x86_64, debug-key signed)
#
# Local builds: `task build` (auto-detects OS). CI mirrors that path
# via OS-specific wails3 Taskfile targets — no separate CI build logic
# to keep in sync.

name: build

on:
  push:
    branches: [ main, dev ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  GO_VERSION:   "1.26.2"
  NODE_VERSION: "22"   # Angular frontend toolchain

jobs:
  frontend:
    name: frontend verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-ng/package-lock.json

      - name: Install Task
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend-ng
        run: npm ci

      - name: Generate bindings
        run: go tool wails3 task common:generate:bindings

      - name: Verify frontend
        working-directory: frontend-ng
        run: npm run verify

  build:
    name: build (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os:        macos
            runner:    macos-26            # arm64; matches the native 26.0 floor
            artifact:  lthn-darwin-arm64
            ext:       .app
            task:      darwin:build
          - os:        linux
            runner:    ubuntu-latest
            artifact:  lthn-linux-amd64
            ext:       ""
            task:      linux:build
          - os:        windows
            runner:    windows-latest
            artifact:  lthn-windows-amd64
            ext:       .exe
            task:      windows:build
          - os:        ios
            runner:    macos-15
            artifact:  lthn-ios-simulator-arm64
            ext:       .app
            task:      ios:package
          - os:        android
            runner:    ubuntu-latest
            artifact:  lthn-android-universal
            ext:       .apk
            task:      android:package:fat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache:      true
          cache-dependency-path: go/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache:        npm
          cache-dependency-path: frontend-ng/package-lock.json

      - name: Install Linux build deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            pkg-config build-essential

      - name: Set up Java
        if: matrix.os == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK and NDK
        if: matrix.os == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        if: matrix.os == 'android'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install Task
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        working-directory: frontend-ng
        run: npm ci

      - name: Generate bindings (TypeScript)
        if: matrix.os != 'ios' && matrix.os != 'android'
        run: go tool wails3 task common:generate:bindings

      - name: Build
        run: go tool wails3 task ${{ matrix.task }}

      - name: Bundle macOS .app
        if: matrix.os == 'macos'
        run: |
          mkdir -p artifact
          # task darwin:build produces bin/lthn.app; zip preserves the
          # codesign + bundle structure across the upload boundary.
          ditto -c -k --keepParent bin/lthn.app artifact/lthn-darwin-arm64.zip

      - name: Stage Linux artifact
        if: matrix.os == 'linux'
        run: |
          mkdir -p artifact
          cp bin/lthn artifact/lthn-linux-amd64

      - name: Stage Windows artifact
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p artifact
          cp bin/lthn.exe artifact/lthn-windows-amd64.exe

      - name: Bundle iOS Simulator .app
        if: matrix.os == 'ios'
        run: |
          mkdir -p artifact
          ditto -c -k --keepParent bin/lthn.app artifact/lthn-ios-simulator-arm64.zip

      - name: Stage Android artifact
        if: matrix.os == 'android'
        run: |
          mkdir -p artifact
          cp bin/lthn.apk artifact/lthn-android-universal.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name:           ${{ matrix.artifact }}
          path:           artifact/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Flatten artifacts
        run: |
          find ./dist -type f -exec mv {} ./dist/ \; 2>/dev/null || true
          ls -la ./dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lthn-darwin-arm64.zip
            dist/lthn-linux-amd64
            dist/lthn-windows-amd64.exe
            dist/lthn-ios-simulator-arm64.zip
            dist/lthn-android-universal.apk
          generate_release_notes: true
          draft:      false
          prerelease: ${{ contains(github.ref, '-') }}
