# Lethean Desktop — build, release, and the browser preview.
#
# There is one branch: main. `dev` is a maintained tag, not a branch — every
# push to main moves it, so the `dev` release is always "what main builds right
# now" and there is one place to get a nightly rather than a branch to keep
# in step.
#
# Triggers:
#   - push to main   → build, refresh the rolling `dev` prerelease, publish the
#                      browser preview to GitHub Pages
#   - tag `v*`       → build + a GitHub Release at that version
#   - pull request   → build only, nothing published
#   - manual dispatch
#
# Each target produces something to install and, where the platform has no
# installer format worth the name, the bare binary as well:
#   - macOS (arm64): lthn.dmg, plus lthn.app ad-hoc signed and zipped
#   - Linux (amd64): .deb and .rpm, plus the raw ELF
#   - Windows (amd64): the NSIS installer, plus lthn.exe
#   - iOS Simulator (arm64): lthn.app (ad-hoc signed, zipped)
#   - Android: lthn.apk (arm64-v8a + x86_64, debug-key signed)
#
# Every binary is stamped with `git describe --tags`, which is why the build
# job checks out full history — a shallow clone has no tags to describe
# against and everything reports itself as `dev`.
#
# Local builds: `wails3 build` / `wails3 package` (both auto-detect the OS).
# CI runs the same two verbs through the shared action, so there is no separate
# CI build logic to keep in step with the local one.

name: build

on:
  push:
    branches: [ main ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Pages needs id-token to deploy; the release jobs raise contents themselves.
permissions:
  contents: read

env:
  GO_VERSION:   "1.26.2"
  NODE_VERSION: "22"   # Angular frontend toolchain

jobs:
  frontend:
    name: frontend verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum

      - name: Install Linux build deps
        uses: ./.github/actions/linux-webkit

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate bindings
        run: go tool wails3 task common:generate:bindings

      - name: Verify frontend
        working-directory: frontend
        run: npm run verify

  build:
    name: build (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os:        macos
            runner:    macos-26            # arm64; matches the native 26.0 floor
            artifact:  lthn-darwin-arm64
            ext:       .app
            # package, not build: `wails3 build` produces bin/lthn, `wails3
            # package` wraps it into bin/lthn.app. The bundling step below zips
            # the .app, so building alone leaves it nothing to find.
            wails3-command: package
          - os:        linux
            runner:    ubuntu-latest
            artifact:  lthn-linux-amd64
            ext:       ""
            # build, where the other two package: `wails3 package` on Linux also
            # builds an AppImage, which wants linuxdeploy and a FUSE mount the
            # runner does not offer. The .deb and .rpm are made directly below.
            wails3-command: build
          - os:        windows
            runner:    windows-latest
            artifact:  lthn-windows-amd64
            ext:       .exe
            # package, not build: it builds bin/lthn.exe and then wraps it in
            # the NSIS installer, in one invocation. Asking for the installer as
            # a separate step would satisfy its `build` dependency by compiling
            # the whole thing a second time.
            wails3-command: package
          - os:        ios
            runner:    macos-15
            artifact:  lthn-ios-simulator-arm64
            ext:       .app
            task:      ios:package
          - os:        android
            runner:    ubuntu-latest
            artifact:  lthn-android-universal
            ext:       .apk
            task:      android:package:fat

    steps:
      # Full history, for the tags alone. The build stamps its version from
      # `git describe --tags`, and the default shallow checkout fetches none —
      # so describe fell through to its `|| echo dev` fallback on every run and
      # every published binary called itself `dev`, tagged releases included.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache:      true
          cache-dependency-path: go/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache:        npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build deps
        if: matrix.os == 'linux' || matrix.os == 'android'
        uses: ./.github/actions/linux-webkit

      - name: Set up Java
        if: matrix.os == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK and NDK
        if: matrix.os == 'android'
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        if: matrix.os == 'android'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install Task
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # duckdb ships as prebuilt cgo bindings, and every file in
      # duckdb-go-bindings/lib/windows-amd64 imports "C". With cgo off the Go
      # toolchain excludes all of them and reports it as "build constraints
      # exclude all Go files", which reads like a platform the package does not
      # support rather than a missing C compiler. macOS and Linux runners
      # detect their system compiler and enable cgo on their own; Windows does
      # not, so it is stated here.
      - name: Enable cgo (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          gcc --version | head -1

      # The whole desktop pipeline is one step. Installing NSIS, turning the
      # .app into a .dmg, generating the Linux packages, naming the output so
      # five platforms can share a release, and uploading it are all true of
      # any Wails v3 project, so they live in the stack rather than here.
      #
      # bindings are not a separate step either: common:build:frontend already
      # depends on generate:bindings, so a local build takes the path CI does.
      - name: Build
        if: matrix.os != 'ios' && matrix.os != 'android'
        uses: dAppCore/build@v4
        with:
          build-name: lthn
          STACK: wails3
          wails3-command: ${{ matrix.wails3-command }}
          # Publishing stays with this workflow — the rolling `dev` prerelease
          # is this project's policy, not the stack's.
          package: false

      # iOS and Android keep the direct invocation — the action has no mobile
      # stack, and routing them through one that cannot build them would only
      # move the failure.
      - name: Build (mobile)
        if: matrix.os == 'ios' || matrix.os == 'android'
        run: go tool wails3 task ${{ matrix.task }}

      - name: Bundle iOS Simulator .app
        if: matrix.os == 'ios'
        run: |
          mkdir -p artifact
          ditto -c -k --keepParent bin/lthn.app artifact/lthn-ios-simulator-arm64.zip

      - name: Stage Android artifact
        if: matrix.os == 'android'
        run: |
          mkdir -p artifact
          cp bin/lthn.apk artifact/lthn-android-universal.apk

      # Mobile only. The desktop three are uploaded by the stack, which named
      # them the same way — leaving this ungated would ask it to upload an
      # artifact/ directory that no longer gets created.
      - name: Upload artifact (mobile)
        if: matrix.os == 'ios' || matrix.os == 'android'
        uses: actions/upload-artifact@v7
        with:
          name:           ${{ matrix.artifact }}
          path:           artifact/*
          retention-days: 7
          if-no-files-found: error

  pages:
    name: browser preview → GitHub Pages
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages:    write
      id-token: write
    environment:
      name: github-pages
      url:  ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache:        npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache:      true
          cache-dependency-path: go/go.sum

      - name: Install Linux build deps
        uses: ./.github/actions/linux-webkit

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # frontend/bindings is generated and gitignored, so the preview build
      # needs it made here the same way the desktop build does.
      - name: Generate bindings
        run: go tool wails3 task common:generate:bindings

      # The preview has no Go process behind it, so it has to be told rather
      # than left retrying a socket that will never answer. The app reads
      # __LTHN_CONNECTION__.offline before the query flag, which a static host
      # cannot supply.
      - name: Declare the preview offline
        working-directory: frontend
        run: |
          set -e
          # /wails/transport.js is served by the Go binary. On a static host it
          # is a 404, so drop it rather than ship a broken script tag.
          sed -i '\#<script src="/wails/transport.js"></script>#d' src/index.html
          sed -i 's#</head>#  <script>globalThis.__LTHN_CONNECTION__={offline:true};</script>\n</head>#' src/index.html
          grep -q "__LTHN_CONNECTION__" src/index.html
          ! grep -q "wails/transport.js" src/index.html

      # A project page is served from /<repo>/, so the base href has to match or
      # every asset resolves against the user-page root. Routing is hash based,
      # which is why no 404 rewrite is needed.
      - name: Build the preview
        working-directory: frontend
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      # angular.json points the build at go/cmd/lthn/dist so the binary can
      # embed it; that same output is what gets published.
      - name: Check the preview built
        run: test -f go/cmd/lthn/dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the preview
        uses: actions/upload-pages-artifact@v5
        with:
          path: go/cmd/lthn/dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

  dev-release:
    name: rolling dev prerelease
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          # The Pages job uploads into the same run; its artifact is not a
          # release asset.
          pattern: lthn-*

      # Flatten into a separate directory, and let it fail. Moving files into
      # ./dist landed each one beside the directory it came out of — and the
      # Linux artifact and its directory have the same name, `lthn-linux-amd64`,
      # so that move was onto its own parent and mv refused it. The error went
      # to /dev/null, `|| true` held the step green, and the Linux build has
      # been quietly missing from every release since the workflow was written.
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find ./dist -type f -exec mv -t out/ {} +
          ls -la out/

      # `dev` is a tag this job moves, not a branch anybody commits to. The
      # release is replaced in place so the download URL never changes and
      # "latest dev" means "what main builds now".
      - name: Refresh the dev prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name:   dev
          name:       dev (rolling — main)
          body: |
            Built from `main` at ${{ github.sha }}.

            This tag moves with every push to main; it is not a branch and not a
            version. For a fixed build take a `v*` release instead.

            Browser preview: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          prerelease: true
          # Every pattern must match something. Left to itself this action
          # prints a shrug for one that does not and publishes the rest, which
          # is the other half of why a missing Linux binary never surfaced.
          fail_on_unmatched_files: true
          files: |
            out/lthn-darwin-arm64.zip
            out/lthn-darwin-arm64.dmg
            out/lthn-linux-amd64
            out/lthn-linux-amd64.deb
            out/lthn-linux-amd64.rpm
            out/lthn-windows-amd64.exe
            out/lthn-windows-amd64-installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          # The Pages job uploads into the same run; its artifact is not a
          # release asset.
          pattern: lthn-*

      # Flatten into a separate directory, and let it fail. Moving files into
      # ./dist landed each one beside the directory it came out of — and the
      # Linux artifact and its directory have the same name, `lthn-linux-amd64`,
      # so that move was onto its own parent and mv refused it. The error went
      # to /dev/null, `|| true` held the step green, and the Linux build has
      # been quietly missing from every release since the workflow was written.
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find ./dist -type f -exec mv -t out/ {} +
          ls -la out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            out/lthn-darwin-arm64.zip
            out/lthn-darwin-arm64.dmg
            out/lthn-linux-amd64
            out/lthn-linux-amd64.deb
            out/lthn-linux-amd64.rpm
            out/lthn-windows-amd64.exe
            out/lthn-windows-amd64-installer.exe
            out/lthn-ios-simulator-arm64.zip
            out/lthn-android-universal.apk
          generate_release_notes: true
          draft:      false
          prerelease: ${{ contains(github.ref, '-') }}
