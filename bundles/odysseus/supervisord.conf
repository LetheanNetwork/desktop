; supervisord runs Odysseus's three co-located services under one PID 1.
; The app is the only port the bundle exposes (7000); chroma + searxng are
; localhost-only, reached in-image.

[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid

; Odysseus app — the webui + API on :7000 (the bundle's exposed port).
; The app tolerates a backend that's still warming, so no hard ordering.
[program:odysseus]
command=uvicorn app:app --host 0.0.0.0 --port 7000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/odysseus.log
stderr_logfile=/app/logs/odysseus.err

; ChromaDB — in-image vector store on :8000; CHROMADB_HOST=localhost points the
; app here. Data persists under the mounted /app/data volume.
[program:chromadb]
command=chroma run --host localhost --port 8000 --path /app/data/chroma
autostart=true
autorestart=true
stdout_logfile=/app/logs/chroma.log
stderr_logfile=/app/logs/chroma.err

; SearXNG — internal search for Deep Research on :8080. Run from source: searx
; is imported in place (PYTHONPATH), not pip-installed as a package.
[program:searxng]
command=python -m searx.webapp
directory=/opt/searxng
environment=SEARXNG_SETTINGS_PATH="/etc/searxng/settings.yml",PYTHONPATH="/opt/searxng"
autostart=true
autorestart=true
stdout_logfile=/app/logs/searxng.log
stderr_logfile=/app/logs/searxng.err
