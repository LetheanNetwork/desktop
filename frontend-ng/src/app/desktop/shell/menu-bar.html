<div class="menubar">
  <!-- Native window controls. Frameless window: these are the only close,
       minimise and maximise a person has. Left on macOS and Linux, right on
       Windows, beside the tray — the platform convention, not a preference. -->
  <ng-template #windowControls>
    <div class="wctl" [class.unavailable]="!controlsAvailable()" [attr.data-wc-error]="windowError() || null">
      <button
        class="wc close"
        [disabled]="!controlsAvailable()"
        (click)="closeWindow()"
        title="Close"
        i18n-title="Close window@@desktop.nativeWindow.close"
        aria-label="Close window"
        i18n-aria-label="Close window@@desktop.nativeWindow.closeLabel"
      ></button>
      <button
        class="wc min"
        [disabled]="!controlsAvailable()"
        (click)="minimiseWindow()"
        title="Minimise"
        i18n-title="Minimise window@@desktop.nativeWindow.minimise"
        aria-label="Minimise window"
        i18n-aria-label="Minimise window@@desktop.nativeWindow.minimiseLabel"
      ></button>
      <button
        class="wc max"
        [disabled]="!controlsAvailable()"
        (click)="toggleMaximiseWindow()"
        [title]="windowMaximised() ? 'Restore' : 'Maximise'"
        aria-label="Maximise or restore window"
        i18n-aria-label="Maximise window@@desktop.nativeWindow.maximiseLabel"
      ></button>
    </div>
  </ng-template>

  <ng-container *ngIf="controlSide() === 'left'" [ngTemplateOutlet]="windowControls"></ng-container>
  <button
    class="hoplite-btn mbtn"
    [class.on]="activeMenuKey() === 'system'"
    [attr.aria-expanded]="activeMenuKey() === 'system'"
    aria-haspopup="true"
    (click)="requestMenu('system', $event)"
    (mouseenter)="hoverMenu('system', $event)"
    aria-label="Lethean"
    i18n-aria-label="System menu label@@desktop.systemMenuLabel"
  >
    <img class="hoplite" src="hoplite_white.png" alt="" width="17" height="17" />
  </button>
  <button
    class="mbtn app"
    [class.on]="activeMenuKey() === 'app'"
    [attr.aria-expanded]="activeMenuKey() === 'app'"
    aria-haspopup="true"
    (click)="requestMenu('app', $event)"
    (mouseenter)="hoverMenu('app', $event)"
  >
    {{ activeAppTitle() }}
  </button>
  <button
    class="mbtn route-category"
    *ngFor="let category of categories()"
    aria-haspopup="true"
    (click)="requestCategory(category, $event)"
  >
    {{ category.title }}
  </button>
  <div class="right">
    <button
      class="trayi"
      (click)="requestTray('lang', $event)"
      aria-label="Language"
      i18n-aria-label="Language tray label@@desktop.tray.languageLabel"
    >
      <span style="font-family: var(--font-mono); font-size: 11px">{{
        language().toUpperCase()
      }}</span></button
    ><button
      class="trayi"
      (click)="requestTray('wifi', $event)"
      aria-label="Network"
      i18n-aria-label="Network tray label@@desktop.tray.networkLabel"
    >
      <lthn-icon name="wifi" size="12"></lthn-icon></button
    ><button
      class="trayi"
      (click)="requestTray('battery', $event)"
      aria-label="Battery"
      i18n-aria-label="Battery tray label@@desktop.tray.batteryLabel"
    >
      <lthn-icon name="battery-three-quarters" size="13"></lthn-icon></button
    ><button
      class="trayi"
      (click)="requestTray('clock', $event)"
      aria-label="Date &amp; time"
      i18n-aria-label="Date and time tray label@@desktop.tray.dateTimeLabel"
    >
      <span class="clock">{{ clockText() }}</span>
    </button>
    <ng-container *ngIf="controlSide() === 'right'" [ngTemplateOutlet]="windowControls"></ng-container>
  </div>
</div>
