version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # SIGN_CERTIFICATE is an empty NSIS/executable certificate path for unsigned local builds.
  SIGN_CERTIFICATE: ""
  # SIGN_THUMBPRINT is an empty Windows certificate-store selector by default.
  SIGN_THUMBPRINT: ""
  # TIMESTAMP_SERVER supplies the standard Authenticode timestamp endpoint.
  TIMESTAMP_SERVER: "http://timestamp.digicert.com"
  # PUBLISHER matches the default certificate subject and build/config.yml company.
  PUBLISHER: "CN=Lethean"
  # MSIX_PROCESSOR_ARCHITECTURE makes Wails' x64 package default explicit.
  MSIX_PROCESSOR_ARCHITECTURE: "x64"
  # CERT_PATH keeps MSIX signing optional for local packages.
  CERT_PATH: ""
  #
  # Password is stored securely in system keychain. Run: go tool wails3 setup signing

  # Docker image for cross-compilation with CGO (used when CGO_ENABLED=1 on non-Windows).
  # Renamed from the wails3-scaffold `wails-cross` so multiple wails3
  # projects on one machine don't collide on the same Docker image tag.
  CROSS_IMAGE: lthn-cross
  # Optional fixed sibling runtime staged by the root build:lem task.
  WINDOWS_LEM_STAGE: '{{printf "%s/build/windows/bin/lem.exe" .ROOT_DIR}}'

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      # Auto-detect CGO: if CGO_ENABLED=1, use Docker; otherwise use native Go cross-compile
      - task: '{{if and (ne OS "windows") (eq .CGO_ENABLED "1")}}build:docker{{else}}build:native{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
    vars:
      # Default to CGO_ENABLED=0 if not explicitly set
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  build:native:
    summary: Builds the application using native Go cross-compilation (Lethean go/ layout)
    internal: true
    deps:
      - task: common:go:work:sync
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
      - task: common:generate:icons
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - cd "{{.GO_DIR}}" && go build {{.BUILD_FLAGS}} -o "../{{.BIN_DIR}}/{{.APP_NAME}}.exe" "{{.GO_CMD}}"
      - cmd: powershell Remove-item {{.GO_DIR}}/cmd/lthn/*.syso
        platforms: [windows]
      - cmd: rm -f {{.GO_DIR}}/cmd/lthn/*.syso
        platforms: [linux, darwin]
    vars:
      # Strip flags (-w -s) removed for the same reason darwin drops them:
      # DuckDB Arrow C symbols imported via go-store's cgo break under
      # ld stripping. -H windowsgui stays — it picks the GUI subsystem.
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-H windowsgui"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Cross-compiles for Windows using Docker with Zig (for CGO builds on non-Windows)
    internal: true
    deps:
      - task: common:build:frontend
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for CGO cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: go tool wails3 task setup:docker
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      # GOTOOLCHAIN=auto — see linux/Taskfile.yml for context.
      # Override the lthn-cross entrypoint — see linux/Taskfile.yml.
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.GO_CACHE_MOUNT}} {{.REPLACE_MOUNTS}} -e GOTOOLCHAIN=auto -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} --entrypoint /app/build/cross.sh {{.CROSS_IMAGE}} windows {{.DOCKER_ARCH}}
      - docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
      - rm -f *.syso
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      # Mount Go module cache for faster builds
      GO_CACHE_MOUNT:
        sh: 'echo "-v ${GOPATH:-$HOME/go}/pkg/mod:/go/pkg/mod"'
      # Extract replace directives from go.mod and create -v mounts for each
      REPLACE_MOUNTS:
        sh: |
          grep -E '^replace .* => ' go.mod 2>/dev/null | while read -r line; do
            path=$(echo "$line" | sed -E 's/^replace .* => //' | tr -d '\r')
            # Convert relative paths to absolute
            if [ "${path#/}" = "$path" ]; then
              path="$(cd "$(dirname "$path")" 2>/dev/null && pwd)/$(basename "$path")"
            fi
            # Only mount if directory exists
            if [ -d "$path" ]; then
              echo "-v $path:$path:ro"
            fi
          done | tr '\n' ' '

  package:
    summary: Packages the application
    cmds:
      - task: '{{if eq (.FORMAT | default "nsis") "msix"}}create:msix:package{{else}}create:nsis:installer{{end}}'
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
    vars:
      FORMAT: '{{.FORMAT | default "nsis"}}'

  generate:syso:
    summary: Generates Windows `.syso` file (placed in the main package dir so go build links it)
    dir: build
    cmds:
      # Go links syso files automatically when they live in the main
      # package directory. With go/cmd/lthn/ as our main, the syso
      # must land there — NOT at repo root like the scaffold default.
      - '{{.WAILS3_TOOL}} generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../{{.GO_DIR}}/cmd/lthn/wails_windows_{{.ARCH}}.syso'
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      # Create the Microsoft WebView2 bootstrapper if it doesn't exist
      - '{{.WAILS3_TOOL}} generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"'
      - |
        {{if eq OS "windows"}}
        if exist "{{.WINDOWS_LEM_STAGE}}" (
          makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" -DARG_LEM_BINARY="{{.WINDOWS_LEM_STAGE}}" project.nsi
        ) else (
          echo   LEM sidecar: optional runtime unavailable; build it or set LTHN_LEM_BIN
          makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        )
        {{else}}
        if [ -f "{{.WINDOWS_LEM_STAGE}}" ]; then
          makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" -DARG_LEM_BINARY="{{.WINDOWS_LEM_STAGE}}" project.nsi
        else
          echo "  LEM sidecar: optional runtime unavailable; build it or set LTHN_LEM_BIN"
          makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        fi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'

  create:msix:package:
    summary: Creates an MSIX package
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      - |-
        {{.WAILS3_TOOL}} tool msix \
          --config "{{.ROOT_DIR}}/wails.json" \
          --name "{{.APP_NAME}}" \
          --executable "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" \
          --arch "{{.PROCESSOR_ARCHITECTURE}}" \
          --out "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.PROCESSOR_ARCHITECTURE}}.msix" \
          {{if .CERT_PATH}}--cert "{{.CERT_PATH}}"{{end}} \
          {{if .PUBLISHER}}--publisher "{{.PUBLISHER}}"{{end}} \
          {{if .USE_MSIX_TOOL}}--use-msix-tool{{else}}--use-makeappx{{end}}
    vars:
      PROCESSOR_ARCHITECTURE: '{{.PROCESSOR_ARCHITECTURE | default .MSIX_PROCESSOR_ARCHITECTURE}}'
      CERT_PATH: '{{.CERT_PATH | default ""}}'
      PUBLISHER: '{{.PUBLISHER | default "CN=Lethean"}}'
      USE_MSIX_TOOL: '{{.USE_MSIX_TOOL | default "false"}}'

  install:msix:tools:
    summary: Installs tools required for MSIX packaging
    cmds:
      - '{{.WAILS3_TOOL}} tool msix-install-tools'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  sign:
    summary: Signs the Windows executable
    desc: |
      Signs the .exe with an Authenticode certificate.
      Configure SIGN_CERTIFICATE or SIGN_THUMBPRINT in the vars section at the top of this file.
      Password is retrieved from system keychain (run: go tool wails3 setup signing)
    deps:
      - task: build
    cmds:
      - '{{.WAILS3_TOOL}} tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.exe" {{if .SIGN_CERTIFICATE}}--certificate {{.SIGN_CERTIFICATE}}{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint {{.SIGN_THUMBPRINT}}{{end}} {{if .TIMESTAMP_SERVER}}--timestamp {{.TIMESTAMP_SERVER}}{{end}}'
    preconditions:
      - sh: '[ -n "{{.SIGN_CERTIFICATE}}" ] || [ -n "{{.SIGN_THUMBPRINT}}" ]'
        msg: "Either SIGN_CERTIFICATE or SIGN_THUMBPRINT is required. Set it in the vars section at the top of build/windows/Taskfile.yml"

  sign:installer:
    summary: Signs the NSIS installer
    desc: |
      Creates and signs the NSIS installer.
      Configure SIGN_CERTIFICATE or SIGN_THUMBPRINT in the vars section at the top of this file.
      Password is retrieved from system keychain (run: go tool wails3 setup signing)
    deps:
      - task: create:nsis:installer
    cmds:
      - '{{.WAILS3_TOOL}} tool sign --input "build/windows/nsis/{{.APP_NAME}}-installer.exe" {{if .SIGN_CERTIFICATE}}--certificate {{.SIGN_CERTIFICATE}}{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint {{.SIGN_THUMBPRINT}}{{end}} {{if .TIMESTAMP_SERVER}}--timestamp {{.TIMESTAMP_SERVER}}{{end}}'
    preconditions:
      - sh: '[ -n "{{.SIGN_CERTIFICATE}}" ] || [ -n "{{.SIGN_THUMBPRINT}}" ]'
        msg: "Either SIGN_CERTIFICATE or SIGN_THUMBPRINT is required. Set it in the vars section at the top of build/windows/Taskfile.yml"
