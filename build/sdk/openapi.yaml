components:
  headers:
    apiDeprecationNoticeURL:
      description: URL pointing to a detailed deprecation notice.
      schema:
        format: uri
        type: string
    apiSuggestedReplacement:
      description: Suggested replacement endpoint for clients to migrate to.
      schema:
        type: string
    deprecation:
      description: Indicates that the endpoint is deprecated.
      schema:
        enum:
          - "true"
        type: string
    link:
      description: Reference to the successor endpoint, when one is provided.
      schema:
        type: string
    sunset:
      description: The date and time after which the endpoint will no longer be supported.
      schema:
        format: date-time
        type: string
    xapiwarn:
      description: Human-readable deprecation warning for clients.
      schema:
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/Error'
              meta:
                $ref: '#/components/schemas/Meta'
              success:
                type: boolean
            required:
              - success
            type: object
      description: Bad request
      headers:
        X-Request-ID:
          description: Request identifier propagated from the client or generated by the server
          schema:
            type: string
    Forbidden:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/Error'
              meta:
                $ref: '#/components/schemas/Meta'
              success:
                type: boolean
            required:
              - success
            type: object
      description: Forbidden
      headers:
        X-Request-ID:
          description: Request identifier propagated from the client or generated by the server
          schema:
            type: string
    GatewayTimeout:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/Error'
              meta:
                $ref: '#/components/schemas/Meta'
              success:
                type: boolean
            required:
              - success
            type: object
      description: Gateway timeout
      headers:
        X-Request-ID:
          description: Request identifier propagated from the client or generated by the server
          schema:
            type: string
    Gone:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/Error'
              meta:
                $ref: '#/components/schemas/Meta'
              success:
                type: boolean
            required:
              - success
            type: object
      description: Gone
      headers:
        Deprecation:
          $ref: '#/components/headers/deprecation'
        X-API-Warn:
          $ref: '#/components/headers/xapiwarn'
        X-Request-ID:
          description: Request identifier propagated from the client or generated by the server
          schema:
            type: string
    InternalServerError:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/Error'
              meta:
                $ref: '#/components/schemas/Meta'
              success:
                type: boolean
            required:
              - success
            type: object
      description: Internal server error
      headers:
        X-Request-ID:
          description: Request identifier propagated from the client or generated by the server
          schema:
            type: string
    RateLimitExceeded:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/Error'
              meta:
                $ref: '#/components/schemas/Meta'
              success:
                type: boolean
            required:
              - success
            type: object
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds until the rate limit resets
          schema:
            minimum: 1
            type: integer
        X-RateLimit-Limit:
          description: Maximum number of requests allowed in the current window
          schema:
            minimum: 1
            type: integer
        X-RateLimit-Remaining:
          description: Number of requests remaining in the current window
          schema:
            minimum: 0
            type: integer
        X-RateLimit-Reset:
          description: Unix timestamp when the rate limit window resets
          schema:
            minimum: 1
            type: integer
        X-Request-ID:
          description: Request identifier propagated from the client or generated by the server
          schema:
            type: string
    Unauthorized:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/Error'
              meta:
                $ref: '#/components/schemas/Meta'
              success:
                type: boolean
            required:
              - success
            type: object
      description: Unauthorised
      headers:
        X-Request-ID:
          description: Request identifier propagated from the client or generated by the server
          schema:
            type: string
  schemas:
    Error:
      properties:
        code:
          type: string
        details: {}
        message:
          type: string
      required:
        - code
        - message
      type: object
    Meta:
      properties:
        duration:
          type: string
        page:
          type: integer
        per_page:
          type: integer
        request_id:
          type: string
        total:
          type: integer
      type: object
    Response:
      properties:
        data: {}
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
        success:
          type: boolean
      required:
        - success
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
