version: '3'

tasks:
  go:mod:tidy:
    summary: No-op — Lethean uses go.work + submodule pins, not proxy resolution
    internal: true
    cmds:
      - echo "skipping go mod tidy — workspace mode handles dependency resolution"

  install:frontend:deps:
    summary: Install Angular frontend dependencies
    dir: frontend-ng
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - npm install

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the Angular frontend directly into go/cmd/lthn/dist for embedding. Skips when no frontend source changed, so Go-only Wails dev cycles avoid the Angular build cost.
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    # Angular writes directly to cmd/lthn/dist. go-task checksums these
    # inputs and skips the command when nothing changed, leaving the dev
    # cycle's blocking build free on Go-only edits.
    sources:
      - frontend-ng/src/**/*
      - frontend-ng/public/**/*
      - frontend-ng/angular.json
      - frontend-ng/package.json
      - frontend-ng/package-lock.json
      - frontend-ng/tsconfig*.json
      - frontend-ng/bindings/**/*
    generates:
      - "{{.GO_DIR}}/cmd/lthn/dist/index.html"
    cmds:
      - cd frontend-ng && npm run build -- --configuration {{.BUILD_CONFIGURATION}}
    vars:
      BUILD_CONFIGURATION: '{{if eq .DEV "true"}}development{{else}}production{{end}}'

  build:frontend:mobile:
    label: build:frontend:mobile (DEV={{.DEV}})
    summary: Build the Angular frontend for iOS and Android without desktop-only Go binding generation
    deps:
      - task: install:frontend:deps
    sources:
      - frontend-ng/src/**/*
      - frontend-ng/public/**/*
      - frontend-ng/angular.json
      - frontend-ng/package.json
      - frontend-ng/package-lock.json
      - frontend-ng/tsconfig*.json
    generates:
      - "{{.GO_DIR}}/cmd/lthn/dist/index.html"
    cmds:
      - cd frontend-ng && npm run build -- --configuration {{.BUILD_CONFIGURATION}}
    vars:
      BUILD_CONFIGURATION: '{{if eq .DEV "true"}}development{{else}}production{{end}}'


  generate:bindings:
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generates TS bindings for pkg/desktop adapter services
    deps:
      - task: go:mod:tidy
    dir: "{{.GO_DIR}}"
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - ../frontend-ng/bindings/**/*
    cmds:
      - wails3 generate bindings -ts -d ../frontend-ng/bindings -f '{{.BUILD_FLAGS}}' -clean=true ./pkg/desktop/... ../external/gui/go/...

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` from build/appicon.png.
    desc: |
      Single source: build/appicon.png (1024×1024 RGBA). wails3 derives every
      size into the .icns + .ico containers. The Icon Composer pipeline
      (-iconcomposerinput appicon.icon -macassetdir darwin) is intentionally
      dropped — the wails3-scaffolded appicon.icon shipped a wails W vector
      that macOS preferred over icons.icns via CFBundleIconName, putting the
      wails brand in the Dock instead of ours. Keeping only the .icns path
      means CFBundleIconFile=icons wins everywhere; the .icns content is
      always derived from our appicon.png. Re-add the Icon Composer path
      when we have a proper Lethean .icon descriptor (today's stand-in svg
      doesn't crop cleanly for Apple's themed renditions).
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  dev:frontend:
    summary: Runs Angular's development server with HMR for the Wails proxy
    dir: frontend-ng
    deps:
      - task: install:frontend:deps
    cmds:
      - npm start -- --host 127.0.0.1 --port "{{.VITE_PORT}}" --hmr --poll 1000

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    desc: |
      Builds the application with the server build tag enabled.
      Server mode runs as a pure HTTP server without native GUI dependencies.
      Usage: task build:server
    deps:
      - task: build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - cd "{{.GO_DIR}}" && go build -tags server {{.BUILD_FLAGS}} -o "../{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}" "{{.GO_CMD}}"
    vars:
      BUILD_FLAGS: "{{.BUILD_FLAGS}}"

  run:server:
    summary: Builds and runs the application in server mode
    deps:
      - task: build:server
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}

  build:docker:
    summary: Builds a Docker image for server mode deployment
    desc: |
      Creates a minimal Docker image containing the server mode binary.
      The image is based on distroless for security and small size.
      Usage: task build:docker [TAG=myapp:latest]
    cmds:
      - docker build -t {{.TAG | default (printf "%s:latest" .APP_NAME)}} -f build/docker/Dockerfile.server .
    vars:
      TAG: "{{.TAG}}"
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."
      - sh: test -f build/docker/Dockerfile.server
        msg: "Dockerfile.server not found. Run 'wails3 update build-assets' to generate it."

  run:docker:
    summary: Builds and runs the Docker image
    desc: |
      Builds the Docker image and runs it, exposing port 8080.
      Usage: task run:docker [TAG=myapp:latest] [PORT=8080]
      Note: The internal container port is always 8080. The PORT variable
      only changes the host port mapping. Ensure your app uses port 8080
      or modify the Dockerfile to match your ServerOptions.Port setting.
    deps:
      - task: build:docker
        vars:
          TAG:
            ref: .TAG
    cmds:
      - docker run --rm -p {{.PORT | default "8080"}}:8080 {{.TAG | default (printf "%s:latest" .APP_NAME)}}
    vars:
      TAG: "{{.TAG}}"
      PORT: "{{.PORT}}"

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    desc: |
      Builds the Docker image needed for cross-compiling to any platform.
      Run this once to enable cross-platform builds from any OS.
    cmds:
      - docker build -t lthn-cross -f build/docker/Dockerfile.cross build/docker/
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."

  ios:device:list:
    summary: Lists connected iOS devices (UDIDs)
    cmds:
      - xcrun xcdevice list

  ios:run:device:
    summary: Build, install, and launch on a physical iPhone using Apple tools (xcodebuild/devicectl)
    vars:
      PROJECT: '{{.PROJECT}}'   # e.g., build/ios/xcode/<YourProject>.xcodeproj
      SCHEME: '{{.SCHEME}}'     # e.g., ios.dev
      CONFIG: '{{.CONFIG | default "Debug"}}'
      DERIVED: '{{.DERIVED | default "build/ios/DerivedData"}}'
      UDID: '{{.UDID}}'         # from `task ios:device:list`
      BUNDLE_ID: '{{.BUNDLE_ID}}' # e.g., com.yourco.wails.ios.dev
      TEAM_ID: '{{.TEAM_ID}}'   # optional, if your project is not already set up for signing
    preconditions:
      - sh: xcrun -f xcodebuild
        msg: "xcodebuild not found. Please install Xcode."
      - sh: xcrun -f devicectl
        msg: "devicectl not found. Please update to Xcode 15+ (which includes devicectl)."
      - sh: test -n '{{.PROJECT}}'
        msg: "Set PROJECT to your .xcodeproj path (e.g., PROJECT=build/ios/xcode/App.xcodeproj)."
      - sh: test -n '{{.SCHEME}}'
        msg: "Set SCHEME to your app scheme (e.g., SCHEME=ios.dev)."
      - sh: test -n '{{.UDID}}'
        msg: "Set UDID to your device UDID (see: task ios:device:list)."
      - sh: test -n '{{.BUNDLE_ID}}'
        msg: "Set BUNDLE_ID to your app's bundle identifier (e.g., com.yourco.wails.ios.dev)."
    cmds:
      - |
        set -euo pipefail
        echo "Building for device: UDID={{.UDID}} SCHEME={{.SCHEME}} PROJECT={{.PROJECT}}"
        XCB_ARGS=(
          -project "{{.PROJECT}}"
          -scheme "{{.SCHEME}}"
          -configuration "{{.CONFIG}}"
          -destination "id={{.UDID}}"
          -derivedDataPath "{{.DERIVED}}"
          -allowProvisioningUpdates
          -allowProvisioningDeviceRegistration
        )
        # Optionally inject signing identifiers if provided
        if [ -n '{{.TEAM_ID}}' ]; then XCB_ARGS+=(DEVELOPMENT_TEAM={{.TEAM_ID}}); fi
        if [ -n '{{.BUNDLE_ID}}' ]; then XCB_ARGS+=(PRODUCT_BUNDLE_IDENTIFIER={{.BUNDLE_ID}}); fi
        xcodebuild "${XCB_ARGS[@]}" build | xcpretty || true
        # If xcpretty isn't installed, run without it
        if [ "${PIPESTATUS[0]}" -ne 0 ]; then
          xcodebuild "${XCB_ARGS[@]}" build
        fi
        # Find built .app
        APP_PATH=$(find "{{.DERIVED}}/Build/Products" -type d -name "*.app" -maxdepth 3 | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Could not locate built .app under {{.DERIVED}}/Build/Products" >&2
          exit 1
        fi
        echo "Installing: $APP_PATH"
        xcrun devicectl device install app --device "{{.UDID}}" "$APP_PATH"
        echo "Launching: {{.BUNDLE_ID}}"
        xcrun devicectl device process launch --device "{{.UDID}}" --stderr console --stdout console "{{.BUNDLE_ID}}"
