# This file contains the configuration for this project.
# When you update `info`, `fileAssociations`, or `protocols`, run `go tool wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Lethean" # Identify the publisher in generated package metadata.
  productName: "Lethean Desktop" # Display the full desktop product name to users.
  productIdentifier: "ai.lthn.desktop" # Use one stable reverse-DNS application identifier.
  description: "Local AI, sovereign by design." # Describe the packaged application consistently.
  copyright: "© 2026, Lethean (EUPL-1.2)" # Publish the product copyright and licence notice.
  comments: "lthn — Lethean Desktop" # Label generated version resources with the binary identity.
  version: "0.1.0" # Seed every package format with the current application version.
  cfBundleIconName: "appicon" # Use the packaged App Icon asset catalogue name on macOS.

# Mobile metadata used by the generated Xcode project.
ios:
  bundleID: "ai.lthn.desktop" # Match the desktop bundle identifier on iOS.
  displayName: "Lethean" # Keep the home-screen label compact.
  version: "0.1.0" # Match the desktop package version.
  company: "Lethean" # Identify the iOS package owner.
  comments: "Local AI, sovereign by design." # Carry the product description into Xcode metadata.
  minIOSVersion: "15.0" # Retain Wails' minimum supported iOS deployment target.
  backgroundModes: [] # Request no background execution modes by default.

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      # Angular writes into go/cmd/lthn/dist on every build:frontend
      # step so go:embed picks it up. Excluding it prevents the watcher
      # from tripping on its own output and causing an infinite rebuild.
      - go/cmd/lthn/dist
      - dist
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The Angular source directory is excluded above; ng serve watches it.
    git_ignore: true
  executes:
    # npm ci — once at session start. Cheap when node_modules is
    # already populated; necessary on a fresh clone or after lockfile
    # bumps. The `once` type fires only the first time the dev loop
    # runs, not on every rebuild trigger.
    - cmd: go tool wails3 task common:install:frontend:deps
      type: once
    # Angular dev server in the background — provides HMR for the
    # standalone app under frontend/src. Development windows load this
    # loopback URL directly so WebKit permits the 9199 socket transport;
    # go:embed dist/ remains the compiled production path.
    - cmd: go tool wails3 task common:dev:frontend
      type: background
    # Regenerate the TS Wails bindings on every Go file change.
    # Without this step, changing a Wails Service method signature
    # (or adding a new one) leaves frontend/bindings/ stale and the
    # WebView keeps calling the old shape. ~1.6s sweep across the
    # package tree — cheap, and the difference between "i changed
    # Go and it broke silently" and "i changed Go and the binding
    # updated".
    - cmd: go tool wails3 task common:generate:bindings
      type: blocking
    # Compile only the host-native Go development binary with Wails' built-in
    # MCP service. Angular HMR already owns the frontend and this path must not
    # rerun the production frontend or optional crew-sidecar build graph.
    # The portable launcher removes stale managed values and supplies only
    # EXTRA_TAGS=mcp, so Wails MCP owns 9099.
    - cmd: node scripts/wails-dev-command.mjs build
      type: blocking
    # Boot the rebuilt .app — long-lived process the dev loop kills
    # and restarts on every blocking-step completion. Wails MCP owns
    # 9099 in an MCP-tagged development build, so the Lethean transport
    # owns 9199. The same launcher removes inherited managed values and
    # supplies only the exact development transport environment.
    - cmd: node scripts/wails-dev-command.mjs run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
  - ext: lthn # Register the desktop's own configuration-document extension.
    name: Lethean Desktop Configuration # Show a recognisable document type in the OS.
    description: Lethean Desktop configuration file # Describe the associated document to users.
    iconName: icons # Reuse the packaged Lethean application icon.
    role: Editor # Let Lethean Desktop open and edit the document.
    mimeType: application/x-lethean # Publish a stable cross-platform MIME type.

# Custom URL protocols. Wails consumes this at package time for macOS
# CFBundleURLTypes, Windows NSIS/MSIX registration, and Linux desktop handlers.
protocols:
  - scheme: lthn # Register the stable external URL scheme.
    description: "Lethean Desktop deep link" # Describe the protocol in package metadata.
