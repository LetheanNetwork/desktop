# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Lethean"
  productName: "Lethean Desktop"
  productIdentifier: "ai.lthn.desktop"
  description: "Local AI, sovereign by design."
  copyright: "© 2026, Lethean (EUPL-1.2)"
  comments: "lthn — Lethean Desktop"
  version: "0.1.0"
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# iOS build configuration (uncomment to customise iOS project generation)
# Note: Keys under `ios` OVERRIDE values under `info` when set.
# ios:
#   # The iOS bundle identifier used in the generated Xcode project (CFBundleIdentifier)
#   bundleID: "com.mycompany.myproduct"
#   # The display name shown under the app icon (CFBundleDisplayName/CFBundleName)
#   displayName: "My Product"
#   # The app version to embed in Info.plist (CFBundleShortVersionString/CFBundleVersion)
#   version: "0.0.1"
#   # The company/organisation name for templates and project settings
#   company: "My Company"
#   # Additional comments to embed in Info.plist metadata
#   comments: "Some Product Comments"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      # Vite output gets copied into go/cmd/lthn/dist on every
      # build:frontend step (so go:embed picks it up). Without
      # excluding it the watcher trips on its own staging copy
      # and we get an infinite rebuild loop.
      - go/cmd/lthn/dist
      - dist
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    # npm install — once at session start. Cheap when node_modules is
    # already populated; necessary on a fresh clone or after lockfile
    # bumps. The `once` type fires only the first time the dev loop
    # runs, not on every rebuild trigger.
    - cmd: wails3 task common:install:frontend:deps
      type: once
    # Vite dev server in the background — provides HMR for the Lit /
    # @lthn/* / @desktop/* sources under frontend/src. Wails3
    # overrides the binary's Assets.Handler to proxy at this port,
    # so go:embed dist/ isn't used while dev mode is live.
    - cmd: wails3 task common:dev:frontend
      type: background
    # Regenerate the TS Wails bindings on every Go file change.
    # Without this step, changing a Wails Service method signature
    # (or adding a new one) leaves frontend/bindings/ stale and the
    # WebView keeps calling the old shape. ~1.6s sweep across the
    # package tree — cheap, and the difference between "i changed
    # Go and it broke silently" and "i changed Go and the binding
    # updated".
    - cmd: wails3 task common:generate:bindings
      type: blocking
    # Build the Go binary. Workspace mode handles dependency
    # resolution; no `go mod tidy` step is needed (and including
    # one rewrites go.mod against workspace paths, which CI rejects).
    - cmd: wails3 task build
      type: blocking
    # Boot the rebuilt .app — long-lived process the dev loop kills
    # and restarts on every blocking-step completion.
    - cmd: wails3 task run
      type: primary

