# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "lthn"
arch: ${GOARCH}
platform: "linux"
# Set by the generate:nfpm task from the same `git describe` that stamps the
# binary, so `dpkg -l lthn` and `lthn version` cannot disagree. A literal here
# went stale the moment a release was cut.
version: ${LTHN_PKG_VERSION}
section: "default"
priority: "extra"
# A fixed project address, not ${GIT_COMMITTER_NAME}/${GIT_COMMITTER_EMAIL}:
# those are unset on a CI runner, which yields the malformed `Maintainer:  <>`,
# and set on a developer's machine, which stamps whoever happened to run the
# build into a published package.
maintainer: Lethean <dev@lethean.io>
description: "Local AI, sovereign by design."
vendor: "Lethean"
homepage: "https://lethean.io"
license: "EUPL-1.2"
release: "1"

contents:
  - src: "./bin/lthn"
    dst: "/usr/local/bin/lthn"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/lthn.png"
  - src: "./build/linux/lthn.desktop"
    dst: "/usr/share/applications/lthn.desktop"
  - src: "./build/linux/application-x-lethean.xml"
    dst: "/usr/share/mime/packages/application-x-lethean.xml"

# Wails v3 compiles its GTK4 path unless the `gtk3` build tag is set, and this
# project does not set it — build/linux and the CI action both install
# libgtk-4-dev + libwebkitgtk-6.0-dev, so the binary links GTK4 and WebKitGTK
# 6.0. Declaring the GTK3 pair here described a build that is not the one being
# packaged, and `libgtk-3-0` does not even resolve on Ubuntu 24.04 (renamed
# libgtk-3-0t64 in the time_t transition) — so the package would have failed to
# install, and where it did install the app would not start.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides: same two libraries, different names per
# packaging family.
overrides:
  # RHEL/CentOS/AlmaLinux/Rocky
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

