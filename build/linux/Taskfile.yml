version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # PGP_KEY: "path/to/signing-key.asc"
  # SIGN_ROLE: "builder"  # Options: origin, maint, archive, builder
  #
  # Password is stored securely in system keychain. Run: wails3 setup signing

  # Docker image for cross-compilation (used when building on non-Linux or no CC available).
  # Renamed from the wails3-scaffold `wails-cross` so multiple wails3
  # projects on one machine don't collide on the same Docker image tag.
  CROSS_IMAGE: lthn-cross
  # Optional fixed sibling runtime staged by the root build:lem task.
  LINUX_LEM_STAGE: 'build/linux/bin/lem'

tasks:
  build:
    summary: Builds the application for Linux
    cmds:
      # Linux requires CGO - use Docker when:
      # 1. Cross-compiling from non-Linux, OR
      # 2. No C compiler is available, OR
      # 3. Target architecture differs from host architecture (cross-arch compilation)
      - task: '{{if and (eq OS "linux") (eq .HAS_CC "true") (eq .TARGET_ARCH ARCH)}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Determine target architecture (defaults to host ARCH if not specified)
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      # Check if a C compiler is available (gcc or clang)
      HAS_CC:
        sh: '(command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1) && echo "true" || echo "false"'

  build:native:
    summary: Builds the application natively on Linux (Lethean go/ layout)
    internal: true
    deps:
      - task: common:go:work:sync
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
      - task: common:generate:icons
      - task: generate:dotdesktop
    cmds:
      - cd "{{.GO_DIR}}" && go build {{.BUILD_FLAGS}} -ldflags "-X dappco.re/lthn/desktop.Version={{.LTHN_VERSION}}" -o "../{{.OUTPUT}}" "{{.GO_CMD}}"
    vars:
      # Strip flags (-w -s) removed for the same cgo/Arrow reason as darwin/windows.
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false{{end}}'
      # Same stamp darwin carries. Without it a Linux build reports the
      # package default, `dev`, and self-update has nothing to compare
      # against the release feed. --match 'v*' skips the moving `dev` channel
      # tag; see the root Taskfile.
      LTHN_VERSION:
        sh: git describe --tags --match 'v*' --always --dirty 2>/dev/null || echo dev
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Builds for Linux using Docker (for non-Linux hosts or when no C compiler available)
    internal: true
    deps:
      - task: common:build:frontend
      - task: common:generate:icons
      - task: generate:dotdesktop
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation to Linux. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: go tool wails3 task setup:docker
    cmds:
      # GOTOOLCHAIN=auto lets the container fetch the Go version
      # pinned in our go.work (currently 1.26.x). The lthn-cross
      # image ships a baseline Go (1.25.x at time of writing) which
      # is older than what we require — without auto-fetch the build
      # fails with "go.work requires go >= 1.26.x".
      # Override the lthn-cross entrypoint with our build/cross.sh so
      # the cross-compile happens inside go/ (our Go module lives in
      # the go/ subfolder, not at repo root like the scaffold default).
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.GO_CACHE_MOUNT}} {{.REPLACE_MOUNTS}} -e GOTOOLCHAIN=auto -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} --entrypoint /app/build/cross.sh "{{.CROSS_IMAGE}}" linux {{.DOCKER_ARCH}}
      - docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-linux-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Mount Go module cache for faster builds
      GO_CACHE_MOUNT:
        sh: 'echo "-v ${GOPATH:-$HOME/go}/pkg/mod:/go/pkg/mod"'
      # Extract replace directives from go.mod and create -v mounts for each
      REPLACE_MOUNTS:
        sh: |
          grep -E '^replace .* => ' go.mod 2>/dev/null | while read -r line; do
            path=$(echo "$line" | sed -E 's/^replace .* => //' | tr -d '\r')
            # Convert relative paths to absolute
            if [ "${path#/}" = "$path" ]; then
              path="$(cd "$(dirname "$path")" 2>/dev/null && pwd)/$(basename "$path")"
            fi
            # Only mount if directory exists
            if [ -d "$path" ]; then
              echo "-v $path:$path:ro"
            fi
          done | tr '\n' ' '

  package:
    summary: Packages the application for Linux
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      - task: create:appimage
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
      - task: create:deb
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
      - task: create:rpm
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
      - task: create:aur
        vars:
          ARCH: '{{.ARCH | default ARCH}}'

  create:appimage:
    summary: Creates an AppImage
    dir: build/linux/appimage
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
      - task: generate:dotdesktop
    cmds:
      - cp "{{.APP_BINARY}}" "{{.APP_NAME}}"
      - cp ../../appicon.png "{{.APP_NAME}}.png"
      - '{{.WAILS3_TOOL}} generate appimage -binary "{{.APP_NAME}}" -icon {{.ICON}} -desktopfile {{.DESKTOP_FILE}} -outputdir {{.OUTPUT_DIR}} -builddir {{.ROOT_DIR}}/build/linux/appimage/build'
      # The Wails generator deliberately accepts one primary executable.
      # Re-run its retained linuxdeploy AppDir once when LEM is staged so the
      # fixed sibling lands at usr/bin/lem inside the final AppImage.
      - |-
        if [ -x "{{.ROOT_DIR}}/{{.LINUX_LEM_STAGE}}" ]; then
          APPDIR="{{.ROOT_DIR}}/build/linux/appimage/build/{{.APP_NAME}}-{{.APPIMAGE_ARCH}}.AppDir"
          TOOL="{{.ROOT_DIR}}/build/linux/appimage/build/linuxdeploy-{{.APPIMAGE_ARCH}}.AppImage"
          OUTPUT="{{.APP_NAME}}-{{.APPIMAGE_ARCH}}.AppImage"
          cp "{{.ROOT_DIR}}/{{.LINUX_LEM_STAGE}}" "$APPDIR/usr/bin/lem"
          (
            cd "{{.ROOT_DIR}}/build/linux/appimage/build"
            DEPLOY_GTK_VERSION="{{.GTK_VERSION}}" NO_STRIP=1 OUTPUT="$OUTPUT" \
              "$TOOL" --appimage-extract-and-run --appdir "$APPDIR" --output appimage --plugin gtk
            mv -f "$OUTPUT" "{{.ROOT_DIR}}/bin/$OUTPUT"
          )
          echo "  packaged LEM beside usr/bin/lthn in $OUTPUT"
        else
          echo "  LEM sidecar: optional runtime unavailable; build it or set LTHN_LEM_BIN"
        fi
    vars:
      APP_NAME: '{{.APP_NAME}}'
      APP_BINARY: '../../../bin/{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}.png'
      DESKTOP_FILE: '../{{.APP_NAME}}.desktop'
      OUTPUT_DIR: '../../../bin'
      APPIMAGE_ARCH: '{{if eq (.ARCH | default ARCH) "arm64"}}aarch64{{else}}x86_64{{end}}'
      GTK_VERSION:
        sh: 'ldd "{{.ROOT_DIR}}/bin/{{.APP_NAME}}" | grep -q "libgtk-4.so" && echo 4 || echo 3'

  create:deb:
    summary: Creates a deb package
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      - task: generate:dotdesktop
      - task: generate:deb

  create:rpm:
    summary: Creates a rpm package
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      - task: generate:dotdesktop
      - task: generate:rpm

  create:aur:
    summary: Creates a arch linux packager package
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      - task: generate:dotdesktop
      - task: generate:aur

  generate:deb:
    summary: Creates a deb package
    cmds:
      - task: generate:nfpm
        vars:
          FORMAT: deb

  generate:rpm:
    summary: Creates a rpm package
    cmds:
      - task: generate:nfpm
        vars:
          FORMAT: rpm

  generate:aur:
    summary: Creates a arch linux packager package
    cmds:
      - task: generate:nfpm
        vars:
          FORMAT: archlinux

  generate:nfpm:
    summary: Creates one Linux package with the optional sibling LEM runtime
    internal: true
    cmds:
      - |-
        set -e
        BASE="./build/linux/nfpm/nfpm.yaml"
        CONFIG="$BASE"
        GENERATED=""
        if [ -x "{{.LINUX_LEM_STAGE}}" ]; then
          GENERATED="$(mktemp -t lthn-nfpm-lem.XXXXXX.yaml)"
          awk -v source="{{.LINUX_LEM_STAGE}}" '
            { print }
            /^contents:$/ {
              print "  - src: \"" source "\""
              print "    dst: \"/usr/local/bin/lem\""
            }
          ' "$BASE" > "$GENERATED"
          CONFIG="$GENERATED"
          echo "  packaging LEM beside /usr/local/bin/lthn"
        else
          echo "  LEM sidecar: optional runtime unavailable; build it or set LTHN_LEM_BIN"
        fi
        trap 'if [ -n "$GENERATED" ]; then rm -f "$GENERATED"; fi' EXIT
        {{.WAILS3_TOOL}} tool package \
          -name "{{.APP_NAME}}" \
          -format "{{.FORMAT}}" \
          -config "$CONFIG" \
          -out "{{.ROOT_DIR}}/bin"
    env:
      # nfpm.yaml reads this. Debian and RPM both require a version starting
      # with a digit, which `git describe` output does not: it is `v0.2.0`, or
      # a bare commit when no tag is reachable. Strip the `v`, and give
      # anything else a numeric prefix rather than letting the packager fail
      # on it — an untagged build is still a package, just not a released one.
      LTHN_PKG_VERSION:
        sh: |
          v="$(git describe --tags --match 'v*' --always --dirty 2>/dev/null || echo dev)"
          v="${v#v}"
          case "$v" in
            [0-9]*) ;;
            *) v="0.0.0+$v" ;;
          esac
          printf '%s' "$v"

  generate:dotdesktop:
    summary: Generates a `.desktop` file
    dir: build
    cmds:
      - mkdir -p {{.ROOT_DIR}}/build/linux/appimage
      - '{{.WAILS3_TOOL}} generate .desktop -name "{{.APP_NAME}}" -exec "{{.EXEC}}" -icon "{{.ICON}}" -outputfile "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop" -categories "{{.CATEGORIES}}"'
    vars:
      APP_NAME: '{{.APP_NAME}}'
      EXEC: '{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}'
      CATEGORIES: 'Development;'
      OUTPUTFILE: '{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'

  sign:deb:
    summary: Signs the DEB package
    desc: |
      Signs the .deb package with a PGP key.
      Configure PGP_KEY in the vars section at the top of this file.
      Password is retrieved from system keychain (run: go tool wails3 setup signing)
    deps:
      - task: create:deb
    cmds:
      - '{{.WAILS3_TOOL}} tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}*.deb" --pgp-key {{.PGP_KEY}} {{if .SIGN_ROLE}}--role {{.SIGN_ROLE}}{{end}}'
    preconditions:
      - sh: '[ -n "{{.PGP_KEY}}" ]'
        msg: "PGP_KEY is required. Set it in the vars section at the top of build/linux/Taskfile.yml"

  sign:rpm:
    summary: Signs the RPM package
    desc: |
      Signs the .rpm package with a PGP key.
      Configure PGP_KEY in the vars section at the top of this file.
      Password is retrieved from system keychain (run: go tool wails3 setup signing)
    deps:
      - task: create:rpm
    cmds:
      - '{{.WAILS3_TOOL}} tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}*.rpm" --pgp-key {{.PGP_KEY}}'
    preconditions:
      - sh: '[ -n "{{.PGP_KEY}}" ]'
        msg: "PGP_KEY is required. Set it in the vars section at the top of build/linux/Taskfile.yml"

  sign:packages:
    summary: Signs all Linux packages (DEB and RPM)
    desc: |
      Signs both .deb and .rpm packages with a PGP key.
      Configure PGP_KEY in the vars section at the top of this file.
      Password is retrieved from system keychain (run: go tool wails3 setup signing)
    cmds:
      - task: sign:deb
      - task: sign:rpm
    preconditions:
      - sh: '[ -n "{{.PGP_KEY}}" ]'
        msg: "PGP_KEY is required. Set it in the vars section at the top of build/linux/Taskfile.yml"
